<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号监控 · 高保真原型 v2.1</title>
<style>
/* ==========================================================================
   设计 Token：design.md v2.0 —— 100% 消费 --dsw-* 变量（带回退值），默认暗色，
   <html data-theme="light"> 整体切换亮色。严禁裸 Hex 直写组件样式。
   ========================================================================== */
:root {
  --dsw-alias-bg-base: #111113;
  --dsw-alias-bg-layer-1: rgba(255,255,255,0.04);
  --dsw-alias-bg-layer-2: rgba(255,255,255,0.07);
  --dsw-alias-bg-layer-3: rgba(255,255,255,0.09);
  --dsw-alias-bg-elevated: #1c1c1f;
  --dsw-alias-bg-mask-1: rgba(0,0,0,0.55);
  --dsw-alias-label-primary: #ffffff;
  --dsw-alias-label-secondary: rgba(255,255,255,0.72);
  --dsw-alias-label-tertiary: rgba(255,255,255,0.40);
  --dsw-alias-label-dimmed: rgba(255,255,255,0.28);
  --dsw-alias-border-l1: rgba(255,255,255,0.06);
  --dsw-alias-border-l2: rgba(255,255,255,0.12);
  --dsw-alias-border-l3: rgba(255,255,255,0.22);
  --dsw-alias-border-l4: rgba(255,255,255,0.32);
  --dsw-alias-interactive-bg-hover: rgba(255,255,255,0.08);
  --dsw-alias-interactive-bg-active: rgba(255,255,255,0.12);
  --dsw-alias-brand-primary: #7961f2;
  --dsw-alias-state-business-tertiary: rgba(121,97,242,0.22);
  /* 状态语义色（design.md §3.5） */
  --dsw-alias-state-error-primary: #f87171;
  --dsw-alias-state-warn-primary: #fbbf24;
  --dsw-alias-state-warn-bg: rgba(245,158,11,0.20);
  /* 增速胶囊语义色（PRD §8.5：全页彩色仅限爆款橙红 / 飙升琥珀） */
  --dsw-specific-velocity-hot-bg: #f0453a;
  --dsw-specific-velocity-hot-fg: #ffffff;
  --dsw-specific-velocity-hot-ring: rgba(240,69,58,0.45);
  --dsw-specific-velocity-rising-fg: #fbbf24;
  --dsw-specific-velocity-rising-bg: rgba(251,191,36,0.20);
  --dsw-specific-velocity-rising-ring: rgba(251,191,36,0.30);
  /* 阴影 */
  --dsw-specific-shadow-pop: 0 10px 28px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  --dsw-specific-shadow-modal: 0 20px 48px rgba(0,0,0,0.6);
  /* 媒体叠加层 Token（design.md §3.6 暗房原则：封面媒体上的文字/角标始终深底白字，
     亮暗主题共用同一组值，不在 light 主题重定义） */
  --dsw-specific-media-fg: #ffffff;
  --dsw-specific-media-fg-strong: rgba(255,255,255,0.92);
  --dsw-specific-media-fg-secondary: rgba(255,255,255,0.85);
  --dsw-specific-media-fg-dimmed: rgba(255,255,255,0.55);
  --dsw-specific-media-ink: #111113;
  --dsw-specific-media-badge-bg: rgba(0,0,0,0.55);
  --dsw-specific-media-badge-bg-strong: rgba(0,0,0,0.60);
  --dsw-specific-media-pill-bg: rgba(0,0,0,0.38);
  --dsw-specific-media-pill-bg-dim: rgba(0,0,0,0.30);
  --dsw-specific-media-chip-bg: rgba(0,0,0,0.40);
  --dsw-specific-media-btn-bg: rgba(0,0,0,0.45);
  --dsw-specific-media-btn-hover: rgba(255,255,255,0.16);
  --dsw-specific-media-avatar-bg: rgba(255,255,255,0.14);
  --dsw-specific-media-border-strong: rgba(255,255,255,0.30);
  --dsw-specific-media-border: rgba(255,255,255,0.26);
  --dsw-specific-media-border-dim: rgba(255,255,255,0.24);
  --dsw-specific-media-border-faint: rgba(255,255,255,0.16);
  --dsw-specific-media-scrim: linear-gradient(180deg, rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.62) 100%);
  --dsw-specific-media-overlay: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.30) 45%, rgba(0,0,0,0.82) 100%);
  --dsw-specific-media-glow-hot: rgba(240,69,58,0.12);
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
html[data-theme="light"] {
  --dsw-alias-bg-base: #ffffff;
  --dsw-alias-bg-layer-1: #f7f7f8;
  --dsw-alias-bg-layer-2: #f0f1f3;
  --dsw-alias-bg-layer-3: #e5e7eb;
  --dsw-alias-bg-elevated: #ffffff;
  --dsw-alias-bg-mask-1: rgba(0,0,0,0.35);
  --dsw-alias-label-primary: #111827;
  --dsw-alias-label-secondary: #4b5563;
  --dsw-alias-label-tertiary: #9ca3af;
  --dsw-alias-label-dimmed: #cbd5e1;
  --dsw-alias-border-l1: rgba(0,0,0,0.06);
  --dsw-alias-border-l2: #e5e7eb;
  --dsw-alias-border-l3: #d1d5db;
  --dsw-alias-border-l4: #9ca3af;
  --dsw-alias-interactive-bg-hover: rgba(0,0,0,0.05);
  --dsw-alias-interactive-bg-active: rgba(0,0,0,0.09);
  --dsw-alias-brand-primary: #6757e7;
  --dsw-alias-state-business-tertiary: rgba(103,87,231,0.20);
  --dsw-alias-state-error-primary: #dc2626;
  --dsw-alias-state-warn-primary: #d97706;
  --dsw-alias-state-warn-bg: rgba(217,119,6,0.16);
  --dsw-specific-velocity-hot-bg: #dc2626;
  --dsw-specific-velocity-hot-fg: #ffffff;
  --dsw-specific-velocity-hot-ring: rgba(220,38,38,0.30);
  --dsw-specific-velocity-rising-fg: #d97706;
  --dsw-specific-velocity-rising-bg: rgba(217,119,6,0.16);
  --dsw-specific-velocity-rising-ring: rgba(217,119,6,0.30);
  --dsw-specific-shadow-pop: 0 10px 28px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
  --dsw-specific-shadow-modal: 0 20px 48px rgba(0,0,0,0.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body {
  background: var(--dsw-alias-bg-base, #111113);
  color: var(--dsw-alias-label-primary, #fff);
  font-family: var(--font-family);
  min-height: 100vh;
  padding: 24px 32px 64px;
  user-select: none;
}
.shell { width: 100%; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- R1 标题条（外壳，§6 A1） ---------- */
.shell-header { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.shell-title { font-size: 20px; line-height: 28px; font-weight: 600; }
.shell-subtitle { font-size: 12px; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,0.40)); }
.btn {
  height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; cursor: pointer; user-select: none; white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, transform 120ms cubic-bezier(.16,1,.3,1), opacity .12s ease;
}
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: none; border-color: var(--dsw-alias-brand-primary, #7961f2); box-shadow: 0 0 0 2px var(--dsw-alias-state-business-tertiary, rgba(121,97,242,.22)); }
.btn-secondary { background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,.04)); border-color: var(--dsw-alias-border-l2, rgba(255,255,255,.12)); color: var(--dsw-alias-label-primary, #fff); }
.btn-secondary:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); border-color: var(--dsw-alias-border-l3, rgba(255,255,255,.22)); }
.btn-primary { background: var(--dsw-alias-label-primary, #fff); color: var(--dsw-alias-bg-base, #111113); border: none; font-weight: 600; }
.btn-primary:hover { opacity: .88; }
.btn-primary[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary[disabled]:active { transform: none; }
.header-import { margin-left: auto; flex-shrink: 0; }

/* ---------- R2 三 Tab ---------- */
.tab-row { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); margin-top: 8px; }
.tab-item { position: relative; padding: 9px 2px; font-size: 13px; font-weight: 400; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); cursor: pointer; }
.tab-item:hover { color: var(--dsw-alias-label-primary, #fff); }
.tab-item.active { color: var(--dsw-alias-label-primary, #fff); font-weight: 600; }
.tab-item.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--dsw-alias-label-primary, #fff); }

/* ---------- R3 监控池状态条 ---------- */
.pool-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; padding: 6px 0; border-bottom: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); }
.pool-summary { font-size: 12px; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); white-space: nowrap; }
.pool-right { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.4; flex-shrink: 0; }
.pool-quota { font-size: 12px; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); font-variant-numeric: tabular-nums; }
.pool-freshness { font-size: 11px; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }

/* ---------- R4 筛选行（严格单行 nowrap） ---------- */
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; height: 52px; border-bottom: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); }
.perf-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.perf-pill { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); background: transparent; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); cursor: pointer; white-space: nowrap; transition: all .12s ease; }
.perf-pill:hover { border-color: var(--dsw-alias-border-l3, rgba(255,255,255,.22)); color: var(--dsw-alias-label-primary, #fff); }
.perf-pill.active { background: var(--dsw-alias-label-primary, #fff); border-color: transparent; color: var(--dsw-alias-bg-base, #111113); font-weight: 600; }
.dd-wrap { position: relative; flex-shrink: 0; }
.dd-trigger { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,.04)); color: var(--dsw-alias-label-primary, #fff); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; transition: all .12s ease; }
.dd-trigger:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); border-color: var(--dsw-alias-border-l3, rgba(255,255,255,.22)); }
.dd-trigger.open { border-color: var(--dsw-alias-border-l4, rgba(255,255,255,.32)); background: var(--dsw-alias-bg-layer-2, rgba(255,255,255,.07)); }
.dd-trigger svg.chev { transition: transform .15s ease; }
.dd-trigger.open svg.chev { transform: rotate(180deg); }
.popover { position: absolute; top: 38px; min-width: 150px; background: var(--dsw-alias-bg-elevated, #1c1c1f); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); border-radius: 10px; padding: 6px; box-shadow: var(--dsw-specific-shadow-pop, 0 10px 28px rgba(0,0,0,.5)); z-index: 100; display: none; animation: omx-pop .12s cubic-bezier(.16,1,.3,1); }
.popover.open { display: block; }
.popover.right { right: 0; }
.popover.left { left: 0; }
@keyframes omx-pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: none; background: transparent; border-radius: 6px; font-size: 12px; color: var(--dsw-alias-label-primary, #fff); cursor: pointer; text-align: left; white-space: nowrap; }
.menu-item:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); }
.menu-item .check-slot { width: 14px; flex-shrink: 0; display: inline-flex; color: var(--dsw-alias-label-primary, #fff); }
.menu-divider { height: 1px; background: var(--dsw-alias-border-l1, rgba(255,255,255,.06)); margin: 4px 6px; }
/* 复选框（自绘，与基底一致） */
.cbox { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--dsw-alias-border-l3, rgba(255,255,255,.22)); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; transition: all .12s ease; }
.cbox.on { background: var(--dsw-alias-label-primary, #fff); border-color: var(--dsw-alias-label-primary, #fff); color: var(--dsw-alias-bg-base, #111113); }

/* 搜索框 */
.search-wrap { position: relative; flex: 1 1 180px; min-width: 120px; max-width: 240px; margin-left: 4px; }
.search-wrap .sicon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); display: inline-flex; pointer-events: none; }
.search-input { width: 100%; height: 32px; padding: 0 10px 0 32px; border-radius: 8px; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,.04)); color: var(--dsw-alias-label-primary, #fff); font-size: 12px; outline: none; transition: all .15s ease; }
.search-input::placeholder { color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.search-input:focus { border-color: var(--dsw-alias-brand-primary, #7961f2); box-shadow: 0 0 0 2px var(--dsw-alias-state-business-tertiary, rgba(121,97,242,.22)); }

/* 刷新按钮 + 额度角标 + D4 原因 Popover */
.refresh-wrap { position: relative; flex-shrink: 0; margin-left: auto; }
.refresh-btn { position: relative; }
.refresh-btn .quota-badge { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; margin-left: 7px; border-radius: 999px; background: var(--dsw-alias-bg-base, #111113); color: var(--dsw-alias-label-primary, #fff); font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.refresh-btn.is-disabled { opacity: .55; }
.refresh-btn.is-fresh { opacity: .75; }
.refresh-btn.shake { animation: shake .18s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
.reason-pop { position: absolute; top: 38px; right: 0; width: 248px; z-index: 110; background: var(--dsw-alias-bg-elevated, #1c1c1f); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); border-radius: 10px; box-shadow: var(--dsw-specific-shadow-pop, 0 10px 28px rgba(0,0,0,.5)); display: none; animation: omx-pop .12s cubic-bezier(.16,1,.3,1); }
.reason-pop.open { display: block; }
.reason-pop .reason-body { padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); }

/* ---------- D1 账号筛选 Popover ---------- */
.account-pop { width: 300px; padding: 8px; }
.acc-pop-header { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 8px; border-bottom: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); margin-bottom: 6px; }
.acc-pop-title { font-size: 11px; font-weight: 500; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.acc-pop-links { display: flex; gap: 8px; }
.pop-link { font-size: 11px; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); cursor: pointer; }
.pop-link:hover { color: var(--dsw-alias-label-primary, #fff); }
.acc-list { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
.acc-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; transition: background .12s ease; }
.acc-item:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); }
.acc-item .cbox { margin-top: 2px; }
.acc-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--dsw-alias-bg-layer-3, rgba(255,255,255,.09)); border: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--dsw-alias-label-primary, #fff); flex-shrink: 0; }
.acc-info { flex: 1; min-width: 0; }
.acc-top { display: flex; align-items: center; gap: 6px; }
.acc-name { font-size: 12px; font-weight: 500; color: var(--dsw-alias-label-primary, #fff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc-jump { width: 18px; height: 18px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .15s ease, background .12s ease, color .12s ease; padding: 0; }
.acc-item:hover .acc-jump { opacity: 1; pointer-events: auto; }
.acc-jump:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); color: var(--dsw-alias-label-primary, #fff); }
.acc-health { margin-left: auto; font-size: 11px; flex-shrink: 0; }
.acc-health.ok { color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.acc-health.cooling { color: var(--dsw-alias-state-warn-primary, #fbbf24); }
.acc-health.reimport { color: var(--dsw-alias-state-error-primary, #f87171); }
.acc-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.acc-meta .pf { display: inline-flex; }
.acc-count { margin-left: auto; white-space: nowrap; }
.acc-reason { margin-top: 4px; font-size: 11px; line-height: 1.5; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }

/* ---------- R5 Feed 瀑布流与分平台卡片（§9：JS 逐张放最短列，禁 CSS columns / grid dense） ---------- */
.feed { position: relative; margin-top: 16px; }
.feed .card { position: absolute; top: 0; left: 0; }

/* §9.1 共用几何：圆角 12px、layer-1 卡底、l1 描边、最小高 144px（放得下约 135px 悬停层） */
.card { border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,.04)); border: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); min-height: 144px; transition: border-color .18s ease, box-shadow .18s ease; }
.card:hover { border-color: var(--dsw-alias-border-l3, rgba(255,255,255,.22)); }
/* 爆款档卡片：橙红细描边 + 极轻外发光（B5，全页唯一允许的发光；已处理样式下撤掉） */
.card.tier-hot { box-shadow: inset 0 0 0 1px var(--dsw-specific-velocity-hot-ring, rgba(240,69,58,.45)), 0 0 14px var(--dsw-specific-media-glow-hot, rgba(240,69,58,0.12)); }
.card.tier-hot.is-done:not(:hover) { box-shadow: none; }

/* 媒体区：贴边、暗底常驻（暗房原则）；比例由数据占位，图片加载前即定高 */
.card-media { display: block; transition: transform .3s ease, filter .18s ease, opacity .18s ease; }
.t-short-video:hover .card-media, .t-long-video:hover .card-media, .t-image:hover .card-media { transform: scale(1.02); }
.t-text, .t-text-media { padding: 12px; }
.t-text-media .card-media { border-radius: 8px; margin-top: 10px; }

/* 标题 / 正文（§9.1 字阶：媒体类标题 13/18/500；文本类正文 14/20/400） */
.card-title-zone { padding: 10px 12px 12px; }
.card-title { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--dsw-alias-label-primary, #fff); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
.card-text-body { font-size: 14px; line-height: 20px; font-weight: 400; color: var(--dsw-alias-label-primary, #fff); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
.clamp-1 { -webkit-line-clamp: 1; }
.clamp-2 { -webkit-line-clamp: 2; }
.clamp-3 { -webkit-line-clamp: 3; }
.clamp-8 { -webkit-line-clamp: 8; }

/* 文本卡顶部胶囊行（28px，胶囊在右端；仅在有胶囊时渲染该行） */
.pill-row { position: relative; z-index: 7; height: 28px; display: flex; align-items: center; justify-content: flex-end; margin-bottom: 8px; }

.duration-badge { position: absolute; right: 8px; bottom: 8px; z-index: 2; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--dsw-specific-media-badge-bg-strong, rgba(0,0,0,0.6)); color: var(--dsw-specific-media-fg, #fff); font-size: 10px; font-weight: 500; font-family: var(--font-mono); display: flex; align-items: center; }

/* 增速胶囊（§3.3 + §9.1：媒体上的胶囊用 media token；文本卡中性档用 alias token） */
.vpill { height: 24px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font-mono); flex-shrink: 0; }
.vpill svg { flex-shrink: 0; }
.vpill.on-media { position: absolute; top: 8px; right: 8px; z-index: 7; }
.vpill.hot { background: var(--dsw-specific-velocity-hot-bg, #f0453a); color: var(--dsw-specific-velocity-hot-fg, #fff); }
.vpill.rising { background: var(--dsw-specific-velocity-rising-bg, rgba(251,191,36,.20)); color: var(--dsw-specific-velocity-rising-fg, #fbbf24); border: 1px solid var(--dsw-specific-velocity-rising-ring, rgba(251,191,36,.30)); backdrop-filter: blur(4px); }
.vpill.on-media.watch { background: var(--dsw-specific-media-pill-bg, rgba(0,0,0,0.38)); color: var(--dsw-specific-media-fg-secondary, rgba(255,255,255,0.85)); border: 1px solid var(--dsw-specific-media-border-dim, rgba(255,255,255,0.24)); backdrop-filter: blur(4px); }
.vpill.on-media.average, .vpill.on-media.relative { background: var(--dsw-specific-media-pill-bg-dim, rgba(0,0,0,0.30)); color: var(--dsw-specific-media-fg-dimmed, rgba(255,255,255,0.55)); border: 1px solid var(--dsw-specific-media-border-faint, rgba(255,255,255,0.16)); backdrop-filter: blur(4px); }
/* 文本卡表面中性档（§9.1：alias token，亮色主题下可见） */
.vpill.on-surface.watch, .vpill.on-surface.average, .vpill.on-surface.relative { background: transparent; color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,0.12)); backdrop-filter: none; }

/* 已处理样式（§9.2 状态裁决：胶囊中性化 + 媒体去色压暗 + 文字降一级，三处同时生效；
   禁止整卡 opacity；只改颜色与滤镜不改尺寸；悬停时全部恢复） */
.card.is-done:not(:hover) .card-media { filter: grayscale(1); opacity: 0.45; }
.card.is-done:not(:hover) .card-title,
.card.is-done:not(:hover) .card-text-body { color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); }
.card.is-done:not(:hover) .vpill.on-media { background: var(--dsw-specific-media-pill-bg, rgba(0,0,0,0.38)); color: var(--dsw-specific-media-fg-secondary, rgba(255,255,255,0.85)); border: 1px solid var(--dsw-specific-media-border-dim, rgba(255,255,255,0.24)); backdrop-filter: blur(4px); }
.card.is-done:not(:hover) .vpill.on-surface { background: transparent; color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,0.12)); backdrop-filter: none; }

/* 悬停层（§9.2：从卡片底部向上贴底排布，作者行 → 指标行 → 三个次级 → 满宽主钮） */
.card-overlay { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 8px; display: flex; flex-direction: column; gap: 7px; opacity: 0; pointer-events: none; transition: opacity .12s ease; }
.card:hover .card-overlay { opacity: 1; pointer-events: auto; }
.card-overlay.on-media { background: var(--dsw-specific-media-overlay, linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.30) 45%, rgba(0,0,0,0.82) 100%)); }
.card-overlay.on-surface { background: var(--dsw-alias-bg-elevated, #1c1c1f); border-top: 0; }
/* §9.2 文本卡悬停层上沿渐隐带（V21）：贴悬停层外沿向上 20px，透明 → bg-elevated，
   被遮住的正文在带内淡出，不出现硬边切开的半行字；不占布局、不挡鼠标、不改卡高 */
.card-overlay.on-surface::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 20px; background: linear-gradient(180deg, transparent 0%, var(--dsw-alias-bg-elevated, #1c1c1f) 100%); pointer-events: none; }

.ov-author { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ov-pf { display: inline-flex; flex-shrink: 0; }
.ov-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ov-time { font-size: 11px; white-space: nowrap; flex-shrink: 0; }
.ov-match { margin-left: auto; height: 18px; padding: 0 6px; border-radius: 5px; font-size: 10px; font-weight: 500; display: inline-flex; align-items: center; flex-shrink: 0; white-space: nowrap; }
.on-media .ov-pf { color: var(--dsw-specific-media-fg, #fff); }
.on-media .ov-name { color: var(--dsw-specific-media-fg-strong, rgba(255,255,255,0.92)); }
.on-media .ov-time { color: var(--dsw-specific-media-fg-dimmed, rgba(255,255,255,0.55)); }
.on-media .ov-match { border: 1px solid var(--dsw-specific-media-border-strong, rgba(255,255,255,0.30)); background: var(--dsw-specific-media-chip-bg, rgba(0,0,0,0.40)); color: var(--dsw-specific-media-fg, #fff); }
.on-surface .ov-pf { color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); }
.on-surface .ov-name { color: var(--dsw-alias-label-primary, #fff); }
.on-surface .ov-time { color: var(--dsw-alias-label-tertiary, rgba(255,255,255,0.40)); }
.on-surface .ov-match { border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,0.12)); background: var(--dsw-alias-bg-layer-2, rgba(255,255,255,0.07)); color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); }

.overlay-metrics { display: inline-flex; align-self: flex-start; max-width: 100%; padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.on-media .overlay-metrics { background: var(--dsw-specific-media-badge-bg, rgba(0,0,0,0.55)); backdrop-filter: blur(4px); color: var(--dsw-specific-media-fg, #fff); }
.on-surface .overlay-metrics { background: var(--dsw-alias-bg-layer-2, rgba(255,255,255,0.07)); color: var(--dsw-alias-label-primary, #fff); }

/* 操作行（§9.2：三个位置按内容宽度分配，不等分；第四位为状态静态文字或标为已处理） */
.act-row { display: flex; align-items: center; gap: 5px; }
.act-btn { flex: 0 1 auto; min-width: 0; height: 28px; padding: 0 7px; border-radius: 8px; font-size: 11px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; transition: background .12s ease, border-color .12s ease, transform 120ms cubic-bezier(.16,1,.3,1); }
.act-btn:active { transform: scale(0.96); }
.on-media .act-btn { border: 1px solid var(--dsw-specific-media-border, rgba(255,255,255,0.26)); background: var(--dsw-specific-media-btn-bg, rgba(0,0,0,0.45)); color: var(--dsw-specific-media-fg, #fff); }
.on-media .act-btn:hover { background: var(--dsw-specific-media-btn-hover, rgba(255,255,255,0.16)); }
.on-surface .act-btn { border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,0.12)); background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,0.04)); color: var(--dsw-alias-label-primary, #fff); }
.on-surface .act-btn:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,0.08)); border-color: var(--dsw-alias-border-l3, rgba(255,255,255,0.22)); }
.act-state { flex: 0 0 auto; height: 28px; display: inline-flex; align-items: center; font-size: 12px; white-space: nowrap; }
.on-media .act-state { color: var(--dsw-specific-media-fg-dimmed, rgba(255,255,255,0.55)); }
.on-surface .act-state { color: var(--dsw-alias-label-secondary, rgba(255,255,255,0.72)); }
.act-primary { width: 100%; height: 32px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .12s ease, opacity .12s ease, transform 120ms cubic-bezier(.16,1,.3,1); }
.act-primary:active { transform: scale(0.96); }
.on-media .act-primary { background: var(--dsw-specific-media-fg, #fff); color: var(--dsw-specific-media-ink, #111113); }
.on-media .act-primary:hover { background: var(--dsw-specific-media-fg-strong, rgba(255,255,255,0.92)); }
.on-surface .act-primary { background: var(--dsw-alias-label-primary, #fff); color: var(--dsw-alias-bg-base, #111113); }
.on-surface .act-primary:hover { opacity: .88; }

/* ---------- 空态 E1 / E2 / E3 ---------- */
.empty-block { display: flex; flex-direction: column; align-items: center; padding: 72px 24px; text-align: center; }
.empty-icon { color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); margin-bottom: 16px; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--dsw-alias-label-primary, #fff); }
.empty-desc { margin-top: 8px; font-size: 13px; line-height: 1.6; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); max-width: 400px; }
.empty-actions { display: flex; gap: 8px; margin-top: 20px; }
.empty-link { margin-top: 16px; background: none; border: none; padding: 0; font-size: 12px; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); cursor: pointer; }
.empty-link:hover { color: var(--dsw-alias-label-primary, #fff); text-decoration: underline; }
.empty-progress { width: 240px; height: 3px; border-radius: 999px; background: var(--dsw-alias-bg-layer-2, rgba(255,255,255,.07)); overflow: hidden; margin-top: 20px; }
.empty-progress i { display: block; height: 100%; width: 40%; border-radius: 999px; background: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); animation: fetchSlide 1.4s ease-in-out infinite; }
@keyframes fetchSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

/* 演示范围外占位（脚手架，不计入产品白名单） */
.tab-placeholder { display: flex; align-items: center; justify-content: center; min-height: 280px; }
.placeholder-box { border: 1px dashed var(--dsw-alias-border-l3, rgba(255,255,255,.22)); border-radius: 12px; padding: 24px 32px; font-size: 13px; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }

/* ---------- 模态弹窗（D2 / D3 / T2） ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 200; background: var(--dsw-alias-bg-mask-1, rgba(0,0,0,.55)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-backdrop.open { display: flex; }
.modal { position: relative; width: min(480px, calc(100vw - 48px)); background: var(--dsw-alias-bg-elevated, #1c1c1f); border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); border-radius: 16px; box-shadow: var(--dsw-specific-shadow-modal, 0 20px 48px rgba(0,0,0,.6)); padding: 20px; animation: omx-pop .14s cubic-bezier(.16,1,.3,1); }
.modal-narrow { width: min(400px, calc(100vw - 48px)); }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-x { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 6px; border: none; background: transparent; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.modal-x:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(255,255,255,.08)); color: var(--dsw-alias-label-primary, #fff); }
.modal-sub { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); }
.field-label { display: block; margin-top: 16px; font-size: 12px; font-weight: 500; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); }
.modal-input { margin-top: 6px; width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); background: var(--dsw-alias-bg-layer-1, rgba(255,255,255,.04)); color: var(--dsw-alias-label-primary, #fff); font-size: 12px; outline: none; transition: all .15s ease; }
.modal-input::placeholder { color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.modal-input:focus { border-color: var(--dsw-alias-brand-primary, #7961f2); box-shadow: 0 0 0 2px var(--dsw-alias-state-business-tertiary, rgba(121,97,242,.22)); }
.modal-hint { margin-top: 8px; min-height: 16px; font-size: 11px; line-height: 1.5; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.modal-hint.echo { color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); }
.modal-error { margin-top: 4px; min-height: 16px; font-size: 11px; line-height: 1.5; color: var(--dsw-alias-state-error-primary, #f87171); display: none; }
.modal-error.show { display: block; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
/* D3 详情 */
.detail-cover { position: relative; height: 110px; border-radius: 10px; overflow: hidden; margin-top: 14px; }
.detail-cover .duration-badge { right: 8px; bottom: 8px; z-index: 2; }
/* D3 文本卡：胶囊在正文上方（§9.4 补充 B11） */
.detail-pill-row { display: flex; margin-top: 14px; }
.detail-body { margin-top: 12px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--dsw-alias-label-primary, #fff); white-space: pre-wrap; }
/* D3 指标行：不复用媒体浮层样式（暗房 token 不适用弹窗白底），改用主题层 token */
.detail-metrics { display: inline-flex; align-self: flex-start; max-width: 100%; margin-top: 4px; padding: 4px 8px; border-radius: 6px; background: var(--dsw-alias-bg-layer-2, rgba(255,255,255,0.07)); font-size: 11px; color: var(--dsw-alias-label-primary, #fff); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-title { margin-top: 12px; font-size: 14px; font-weight: 600; line-height: 1.5; }
.detail-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; }
.detail-row .dlabel { width: 52px; flex-shrink: 0; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.detail-row .dvalue { color: var(--dsw-alias-label-primary, #fff); display: flex; align-items: center; gap: 6px; min-width: 0; }
.detail-note { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--dsw-alias-border-l1, rgba(255,255,255,.06)); font-size: 11px; line-height: 1.6; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }

/* ---------- Toast（T1，底部居中 2.4s） ---------- */
.app-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 300; background: var(--dsw-alias-bg-elevated, #1c1c1f); backdrop-filter: blur(16px); border: 1px solid var(--dsw-alias-border-l3, rgba(255,255,255,.22)); color: var(--dsw-alias-label-primary, #fff); padding: 8px 16px; border-radius: 999px; font-size: 12px; box-shadow: var(--dsw-specific-shadow-pop, 0 10px 30px rgba(0,0,0,.7)); opacity: 0; pointer-events: none; transition: all .2s cubic-bezier(.16,1,.3,1); display: flex; align-items: center; gap: 8px; max-width: 80vw; }
.app-toast.is-active { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 演示控制面板（§7.4 脚手架：虚线边框 + DEMO 字样） ---------- */
.demo-panel { position: fixed; right: 16px; bottom: 16px; z-index: 400; border: 1.5px dashed var(--dsw-alias-border-l3, rgba(255,255,255,.22)); border-radius: 12px; background: var(--dsw-alias-bg-elevated, #1c1c1f); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; box-shadow: var(--dsw-specific-shadow-pop, 0 10px 28px rgba(0,0,0,.5)); }
.demo-tag { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dsw-alias-label-tertiary, rgba(255,255,255,.40)); }
.demo-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); }
.demo-row input[type="checkbox"] { accent-color: var(--dsw-alias-brand-primary, #7961f2); width: 13px; height: 13px; margin: 0; cursor: pointer; }
.demo-row label { cursor: pointer; }
.demo-divider { height: 1px; background: var(--dsw-alias-border-l1, rgba(255,255,255,.06)); }
.demo-btn { height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--dsw-alias-border-l2, rgba(255,255,255,.12)); background: transparent; color: var(--dsw-alias-label-secondary, rgba(255,255,255,.72)); font-size: 11px; cursor: pointer; transition: all .12s ease; white-space: nowrap; }
.demo-btn:hover { color: var(--dsw-alias-label-primary, #fff); border-color: var(--dsw-alias-border-l3, rgba(255,255,255,.22)); }
</style>
</head>
<body>

<div class="shell">
  <!-- R1 标题条：共享外壳（§6 A1，现网 locales.js 文案） -->
  <header class="shell-header">
    <h1 class="shell-title">灵感社区</h1>
    <span class="shell-subtitle">沉淀爆款视频、图文与社媒文案灵感，支持 AI 多维解构与一键复刻</span>
    <button type="button" class="btn btn-secondary header-import" id="importShellBtn"></button>
  </header>

  <!-- R2 三 Tab -->
  <nav class="tab-row" id="tabRow">
    <div class="tab-item" data-tab="trend">爆款趋势</div>
    <div class="tab-item" data-tab="library">灵感库</div>
    <div class="tab-item active" data-tab="monitor">账号监控</div>
  </nav>

  <!-- 账号监控页内 -->
  <div id="monitorPane">
    <!-- R3 监控池状态条 -->
    <div class="pool-bar" id="poolBar">
      <span class="pool-summary" id="poolSummary"></span>
      <div class="pool-right">
        <span class="pool-quota" id="poolQuota"></span>
        <span class="pool-freshness" id="poolFresh"></span>
      </div>
    </div>

    <!-- R4 筛选行（单行 nowrap） -->
    <div class="filter-row" id="filterRow">
      <div class="perf-group" id="perfGroup"></div>

      <div class="dd-wrap" id="platformWrap">
        <button type="button" class="dd-trigger" id="platformTrigger"></button>
        <div class="popover left" id="platformPop" style="min-width:160px"></div>
      </div>

      <div class="dd-wrap" id="accountWrap">
        <button type="button" class="dd-trigger" id="accountTrigger"></button>
        <div class="popover left account-pop" id="accountPop"></div>
      </div>

      <div class="dd-wrap" id="sortWrap">
        <button type="button" class="dd-trigger" id="sortTrigger"></button>
        <div class="popover left" id="sortPop" style="min-width:140px"></div>
      </div>

      <div class="search-wrap">
        <span class="sicon" id="searchIcon"></span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索内容或账号" autocomplete="off">
      </div>

      <div class="refresh-wrap">
        <button type="button" class="btn btn-primary refresh-btn" id="refreshBtn"></button>
        <div class="reason-pop" id="reasonPop">
          <div class="reason-body" id="reasonBody"></div>
        </div>
      </div>
    </div>

    <!-- R5 Feed 网格 / 三档空态（JS 渲染） -->
    <div id="feedArea" style="margin-top:0"></div>
  </div>

  <!-- 爆款趋势 / 灵感库 Tab 占位（演示范围外） -->
  <div class="tab-placeholder" id="otherPane" style="display:none">
    <div class="placeholder-box">演示范围外</div>
  </div>
</div>

<!-- D2 导入弹窗 -->
<div class="modal-backdrop" id="importBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title">导入账号</div>
    <div class="modal-sub">支持 TikTok、Instagram、YouTube、X 的账号主页链接</div>
    <label class="field-label" for="importInput">账号主页链接</label>
    <input type="text" class="modal-input" id="importInput" placeholder="粘贴账号主页链接…" autocomplete="off" spellcheck="false">
    <div class="modal-hint" id="importHint">YouTube 频道请使用 https://www.youtube.com/channel/UC… 形式的链接</div>
    <div class="modal-error" id="importError"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="importCancel">取消</button>
      <button type="button" class="btn btn-primary" id="importSubmit" disabled>导入</button>
    </div>
  </div>
</div>

<!-- D3 详情弹窗（内容 JS 渲染） -->
<div class="modal-backdrop" id="detailBackdrop">
  <div class="modal" role="dialog" aria-modal="true" id="detailModal"></div>
</div>

<!-- T2 深度探针确认弹窗 -->
<div class="modal-backdrop" id="probeBackdrop">
  <div class="modal modal-narrow" role="dialog" aria-modal="true">
    <div class="modal-title" id="probeTitle"></div>
    <div class="modal-sub" id="probeBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="probeCancel">取消</button>
      <button type="button" class="btn btn-primary" id="probeOk">确认刷新</button>
    </div>
  </div>

];

  POP_PAIRS.forEach(([p, t]) => {
    $(p).classList.remove('open');
    if (t) $(t).classList.remove('open');
  });
}
function togglePop(popId, triggerId) {
  const pop = $(popId), willOpen = !pop.classList.contains('open');
  closePops();
  if (willOpen) {
    pop.classList.add('open');
    if (triggerId) $(triggerId).classList.add('open');
  }
}

/* ---------- 过滤与排序 ---------- */
function filteredPosts() {
  const q = state.search.trim().toLowerCase();
  let list = POSTS.filter(p => {
    const acc = ACC_BY_ID[p.account];
    if (!acc) return false;
    if (!state.accounts.has(p.account)) return false;
    if (!state.platforms.has(acc.platform)) return false;
    if (state.perf === 'hot' && p.v.type !== 'hot') return false;
    if (state.perf === 'rising' && p.v.type !== 'rising') return false;
    if (state.perf === 'latest' && p.minutes >= 1440) return false;
    if (q) {
      const hay = (p.title + ' ' + acc.name + ' ' + acc.handle).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (state.sort === 'velocity') list.sort((a, b) => (b.v.vph || 0) - (a.v.vph || 0));
  else if (state.sort === 'latest') list.sort((a, b) => a.minutes - b.minutes);
  else if (state.sort === 'views') list.sort((a, b) => b.views - a.views);
  return list;
}

/* ---------- §9.3 瀑布流：逐张放入放置前底边最高的列（最短列；同列底高取最左列） ---------- */
let masonryObserver = null;
let lastFeedWidth = 0;
function layoutMasonry() {
  const feed = document.getElementById('feedMasonry');
  if (!feed) return;
  const cards = feed.querySelectorAll('.card');
  if (!cards.length) return;
  const W = feed.clientWidth;
  if (W < 1) return;   // 容器不可见（如 Tab 未选中）时跳过，恢复可见由 ResizeObserver 再触发
  const n = Math.max(2, Math.min(6, Math.floor((W + 16) / 236)));
  const colW = (W - 16 * (n - 1)) / n;
  const bottoms = new Array(n).fill(0);
  cards.forEach((card) => {
    card.style.width = colW + 'px';
    let c = 0;
    for (let i = 1; i < n; i++) { if (bottoms[i] < bottoms[c]) c = i; }
    card.style.left = c * (colW + 16) + 'px';
    card.style.top = bottoms[c] + 'px';
    card.dataset.col = c + 1;   // 1 基列号，供验收脚本读取
    bottoms[c] += card.offsetHeight + 16;
  });
  feed.style.height = Math.max(0, Math.max(...bottoms) - 16) + 'px';
}
function watchFeedResize() {
  if (!('ResizeObserver' in window)) return;
  masonryObserver = new ResizeObserver(() => {
    const w = $('feedArea').clientWidth;
    if (Math.abs(w - lastFeedWidth) < 1) return;
    lastFeedWidth = w;
    layoutMasonry();
  });
  masonryObserver.observe($('feedArea'));
}

function parseAccountUrl(v) {
  v = v.trim();
  if (!v) return null;
  let url;
  try { url = new URL(v.includes('://') ? v : 'https://' + v); } catch { return null; }
  const host = url.hostname.replace(/^www\./, '').toLowerCase();
  const segs = url.pathname.split('/').filter(Boolean);
  if (host === 'tiktok.com' || host.endsWith('.tiktok.com')) {
    const h = segs.find(s => s.startsWith('@'));
    return h && h.length > 1 ? { handle: h, platform: 'TikTok' } : null;
  }
  if (host === 'instagram.com' || host.endsWith('.instagram.com')) {
    const seg = segs[0];
    return seg && !['p','reel','reels','stories','explore'].includes(seg) ? { handle: '@' + seg, platform: 'Instagram' } : null;
  }
  if (host === 'x.com' || host === 'twitter.com') {
    const seg = segs[0];
    return seg && !['home','explore','i','search'].includes(seg) ? { handle: '@' + seg, platform: 'X' } : null;
  }
  if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
    if (segs[0] === 'channel' && segs[1] && segs[1].startsWith('UC')) return { handle: segs[1], platform: 'YouTube' };
    const h = segs.find(s => s.startsWith('@'));
    return h && h.length > 1 ? { handle: h, platform: 'YouTube' } : null;
  }
  return null;
}

function onRefresh() {
  // 原因优先级：额度耗尽 > 账号停止 > 冷却
  if (state.quotaLeft <= 0) { showReason('quota'); return; }
  if (state.stopped) { showReason('stopped'); return; }
  // 10 分钟内第二次点击：进入冷却并弹出 D4 原因（不再扣额度）
  if (state.cooldown || refreshCount >= 1) { state.cooldown = true; showReason('cooldown'); return; }
  state.quotaLeft -= 1;
  refreshCount += 1;
  state.freshnessMin = 1; // 最小 1 分钟：不出现「数据更新于 0 分钟前」

  renderPoolBar(); renderRefreshBtn();
}

  /* 外壳 / 弹窗触发 */
  $('importShellBtn').addEventListener('click', openImport);
  $('importCancel').addEventListener('click', () => closeModal('importBackdrop'));
  $('importSubmit').addEventListener('click', () => {
    if (!importParsed) return;
    const handle = importParsed.handle;
    state.imported.push({
      id: 'imp' + Date.now(), name: handle.replace(/^@/, ''),
      handle: handle.startsWith('@') ? handle : '@' + handle,
      platform: Object.keys(PLAT_LABEL).find(k => PLAT_LABEL[k] === importParsed.platform) || 'x',
      health: { type: 'ok' }, works: 0,
    });
    state.accounts.add(state.imported[state.imported.length - 1].id);
    closeModal('importBackdrop');
    toast(T.importToast(handle));
    renderPoolBar(); renderAccountTrigger(); renderAccountPop(); renderFeed();
  });
  $('importInput').addEventListener('input', e => {
    const hint = $('importHint');
    const err = $('importError');
    const v = e.target.value.trim();
    if (!v) {
      importParsed = null;
      // YouTube 提示行常驻（import.ytHint），错误文本在独立一行显示
      hint.textContent = 'YouTube 频道请使用 https://www.youtube.com/channel/UC… 形式的链接';
      hint.className = 'modal-hint';
      err.classList.remove('show');
      $('importSubmit').disabled = true;
      return;
    }
    importParsed = parseAccountUrl(v);
    if (importParsed) {
      // 规格授权：识别成功的回显可替换提示区
      hint.textContent = T.importEcho(importParsed.handle, importParsed.platform);
      hint.className = 'modal-hint echo';
      err.classList.remove('show');
      $('importSubmit').disabled = false;
    } else {
      hint.textContent = 'YouTube 频道请使用 https://www.youtube.com/channel/UC… 形式的链接';
      hint.className = 'modal-hint';
      err.textContent = T.importError;
      err.classList.add('show');
      $('importSubmit').disabled = true;
    }
  });

  /* D3 内部按钮（委托在 backdrop 上） */
  $('detailBackdrop').addEventListener('click', e => {
    if (e.target.closest('[data-mclose]')) { closeModal('detailBackdrop'); return; }
    const act = e.target.closest('[data-act]');
    if (act) { cardAction(act.dataset.act, Number(act.dataset.id), act); return; }
    if (e.target === $('detailBackdrop')) closeModal('detailBackdrop');
  });
  $('importBackdrop').addEventListener('click', e => {
    if (e.target === $('importBackdrop')) closeModal('importBackdrop');
  });
  $('probeBackdrop').addEventListener('click', e => {
    if (e.target === $('probeBackdrop')) closeModal('probeBackdrop');
  });
  $('probeCancel').addEventListener('click', () => closeModal('probeBackdrop'));
  $('probeOk').addEventListener('click', () => {
    if (state.quotaLeft >= 3) {
      state.quotaLeft -= 3;
      state.freshnessMin = 1;
      closeModal('probeBackdrop');
      renderPoolBar(); renderRefreshBtn();
    }
  });

  /* 全局：点外部 / Esc 关闭 */
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.dd-wrap') && !e.target.closest('.refresh-wrap')) closePops();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (anyModalOpen()) closeAllModals(); else closePops();
    }
  });

  /* 演示面板 */
  $('demoEmpty').addEventListener('change', e => { state.poolCleared = e.target.checked; renderPoolBar(); renderFeed(); });
  $('demoFetching').addEventListener('change', e => { state.fetching = e.target.checked; renderPoolBar(); renderFeed(); });
  $('demoQuota').addEventListener('change', e => { state.quotaLeft = e.target.checked ? 0 : 6; renderPoolBar(); renderRefreshBtn(); });
  $('demoStopped').addEventListener('change', e => { state.stopped = e.target.checked; renderRefreshBtn(); });
  $('demoTheme').addEventListener('change', e => { document.documentElement.dataset.theme = e.target.checked ? 'light' : 'dark'; });
  $('demoProbe').addEventListener('click', openProbe);
  $('demoReset').addEventListener('click', demoReset);

  watchFeedResize();
  renderAll();
}

init();
</script>
</body>
</html>
