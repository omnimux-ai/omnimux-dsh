<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniMux 输入框底栏「产品」按钮鼠标交互样式对齐演示</title>
  <style>
    :root {
      --omx-violet-primary: #7961f2;
      --omx-violet-glow: rgba(121, 97, 242, 0.25);
      --omx-control-height: 28px;
      --omx-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="dark"] {
      --dsw-alias-bg-base: #111113;
      --dsw-alias-bg-layer-1: #18181b;
      --dsw-alias-bg-layer-2: #212124;
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.08);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
      --dsw-alias-border-l3: rgba(255, 255, 255, 0.25);
      --dsw-alias-border: rgba(255, 255, 255, 0.10);
      --dsw-alias-label-primary: #ffffff;
      --dsw-alias-label-secondary: rgba(255, 255, 255, 0.70);
      --dsw-alias-label-tertiary: rgba(255, 255, 255, 0.40);
      --dsw-alias-label-caption: rgba(255, 255, 255, 0.45);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
      --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.12);
      --dsw-dot-grid: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--omx-font-family);
      background-color: var(--dsw-alias-bg-base);
      background-image: var(--dsw-dot-grid);
      background-size: 20px 20px;
      color: var(--dsw-alias-label-primary);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-card {
      background: var(--dsw-alias-bg-layer-1);
      border: 1px solid var(--dsw-alias-border-l1);
      border-radius: 12px;
      padding: 18px 22px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--dsw-alias-label-primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-desc {
      font-size: 13px;
      color: var(--dsw-alias-label-secondary);
      line-height: 1.6;
    }

    /* 模拟真实的 DSH 输入框容器 */
    .composer-mock-card {
      background: var(--dsw-alias-bg-layer-1);
      border: 1px solid var(--dsw-alias-border-l2);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .composer-input-area {
      min-height: 48px;
      color: var(--dsw-alias-label-tertiary);
      font-size: 14px;
      padding: 4px 8px;
      user-select: none;
    }

    /* 真实的输入框底栏工具条 */
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--dsw-alias-border-l1);
      padding-top: 12px;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 官方加号图标按钮 */
    .plus-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--dsw-alias-label-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .plus-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    /* 修改前的「产品」按钮：硬编码样式，无鼠标交互 */
    .product-btn-before {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 9999px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border);
      color: var(--dsw-alias-label-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      box-sizing: border-box;
      /* 无 hover / active 样式 */
    }

    /* 修改后的「产品」按钮：严格对标右侧模型切换按钮 */
    .omnimux-composer-product-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 28px;
      box-sizing: border-box;
      padding: 0 8px;
      border: 0;
      box-shadow: none;
      border-radius: 24px;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      user-select: none;
      transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .omnimux-composer-product-btn:hover,
    .omnimux-composer-product-btn.is-active,
    .omnimux-composer-product-btn[data-state="open"] {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .omnimux-composer-product-btn:active {
      background: var(--dsw-alias-interactive-bg-active);
    }

    .omnimux-composer-product-btn:focus-visible {
      box-shadow: 0 0 0 2px var(--dsw-alias-border-l3);
      outline: none;
    }

    /* 右侧官方模型切换按钮 (1:1 提取自 DSH 原生客户端代码) */
    .model-selector-trigger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      color: var(--dsw-alias-label-secondary);
      cursor: pointer;
      background: transparent;
      border: none;
      border-radius: 24px;
      outline: none;
      padding: 0 4px 0 8px;
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
      box-sizing: border-box;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .model-selector-trigger:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .model-selector-trigger:active {
      background: var(--dsw-alias-interactive-bg-active);
    }

    /* 发送按钮 */
    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: var(--dsw-alias-label-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 150ms ease;
    }
    .send-btn:hover {
      opacity: 0.85;
    }

    /* 对比说明卡片 */
    .grid-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .compare-card {
      background: var(--dsw-alias-bg-layer-1);
      border: 1px solid var(--dsw-alias-border-l1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compare-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-bad {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .badge-good {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .interactive-log {
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #0d0d0f;
      border: 1px solid var(--dsw-alias-border-l1);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: var(--omx-violet-primary);
      min-height: 38px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <div class="header-title">
        <span>输入框底栏「产品」按钮鼠标交互优化验收</span>
      </div>
      <div class="header-desc">
        请在下方模拟的真实输入框中，将鼠标悬停在左侧<strong>「产品」按钮</strong>与右侧<strong>「Gemini 3.8 Flash Max」模型按钮</strong>上进行交互对比体验。
      </div>
    </div>

    <!-- 模拟完整输入框 -->
    <div class="composer-mock-card">
      <div class="composer-input-area">
        在这里输入提示词或选择关联的产品...
      </div>

      <div class="composer-toolbar">
        <div class="toolbar-left">
          <!-- 加号 -->
          <button class="plus-btn" title="添加附件">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <!-- 优化后的产品按钮 -->
          <button id="targetProductBtn" class="omnimux-composer-product-btn" title="产品" aria-label="产品">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>产品</span>
          </button>
        </div>

        <div class="toolbar-right">
          <!-- 官方右侧模型切换按钮 -->
          <button id="modelBtn" class="model-selector-trigger" title="Gemini 3.8 Flash Max">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Gemini 3.8 Flash <span style="color: var(--dsw-alias-label-caption);">Max</span></span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style="color: var(--dsw-alias-label-caption);">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- 发送按钮 -->
          <button class="send-btn" title="发送">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 实时交互反馈状态监测 -->
    <div class="interactive-log" id="statusLog">
      ▶ 当前状态：请将鼠标移动到上方按钮体验悬停微光与点击反馈...
    </div>

    <!-- 前后效果对比卡片 -->
    <div class="grid-compare">
      <div class="compare-card">
        <div class="compare-title">
          <span class="compare-badge badge-bad">修复前</span>
          <span>硬编码无响应</span>
        </div>
        <p style="font-size: 12px; color: var(--dsw-alias-label-secondary); line-height: 1.5;">
          采用行内写死背景与边框，鼠标悬停完全无反应，风格生硬。
        </p>
        <div style="padding: 12px; background: var(--dsw-alias-bg-layer-2); border-radius: 8px; display: flex; align-items: center;">
          <button class="product-btn-before">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>产品</span>
          </button>
          <span style="font-size: 12px; color: var(--dsw-alias-label-caption); margin-left: 10px;">← 悬停该按钮无任何变化</span>
        </div>
      </div>

      <div class="compare-card">
        <div class="compare-title">
          <span class="compare-badge badge-good">修复后</span>
          <span>1:1 对齐右侧模型按钮规范</span>
        </div>
        <p style="font-size: 12px; color: var(--dsw-alias-label-secondary); line-height: 1.5;">
          透明底色、28px 高度、24px 胶囊圆角，悬停平滑高亮微光，按压带下沉微反馈。
        </p>
        <div style="padding: 12px; background: var(--dsw-alias-bg-layer-2); border-radius: 8px; display: flex; align-items: center;">
          <button class="omnimux-composer-product-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>产品</span>
          </button>
          <span style="font-size: 12px; color: var(--dsw-alias-label-caption); margin-left: 10px;">← 悬停出现胶囊微光</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById('statusLog');
    const productBtn = document.getElementById('targetProductBtn');
    const modelBtn = document.getElementById('modelBtn');

    function bindEvents(btn, name) {
      btn.addEventListener('mouseenter', () => {
        log.textContent = `▶ [${name}] 鼠标悬停 (Hover)：背景平滑高亮为 rgba(255, 255, 255, 0.08)，文字提亮至 Primary 纯白`;
      });
      btn.addEventListener('mouseleave', () => {
        log.textContent = `▶ [${name}] 鼠标移出：恢复透明底色与次级文本色`;
      });
      btn.addEventListener('mousedown', () => {
        log.textContent = `▶ [${name}] 鼠标按压 (Active)：触发轻微按压底色反馈`;
      });
      btn.addEventListener('click', () => {
        const isActive = btn.classList.toggle('is-active');
        log.textContent = `▶ [${name}] 点击触发：当前处于 ${isActive ? '【弹窗已展开 / 激活保持】' : '【已关闭】'} 状态`;
      });
    }

    bindEvents(productBtn, '产品按钮');
    bindEvents(modelBtn, '模型切换按钮');
  </script>
</body>
</html>
