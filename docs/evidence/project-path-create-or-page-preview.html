<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>确认创建按路径加页 · 预演</title>
  <style>
    :root {
      --dsw-alias-bg-layer-1: #fff;
      --dsw-alias-bg-layer-2: #f7f7f8;
      --dsw-alias-label-primary: #1a1a1a;
      --dsw-alias-label-secondary: #5c5c66;
      --dsw-alias-label-tertiary: #8b8b96;
      --dsw-alias-border-l1: #ececef;
      --dsw-alias-border-l2: #e2e2e6;
      --dsw-alias-border-hover: #c9c9d1;
      --dsw-alias-brand-primary: #5b4dff;
      --dsw-alias-state-business-tertiary: rgba(91, 77, 255, 0.16);
      --dsw-alias-state-error-primary: #d92d20;
      --dsw-alias-interactive-bg-hover: #f4f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: #ececef;
      color: var(--dsw-alias-label-primary);
    }
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .dialog {
      width: 440px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 48px rgba(20, 20, 28, 0.12);
      padding: 20px 20px 16px;
    }
    .dialog-title {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
    }
    .omnimux-workflow-form { display: flex; flex-direction: column; gap: 12px; }
    .omnimux-new-project-name {
      display: flex; align-items: stretch; height: 40px;
      border: 1px solid var(--dsw-alias-border-l2); border-radius: 10px; overflow: hidden;
    }
    .omnimux-new-project-name-prefix {
      width: 40px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--dsw-alias-label-secondary); border-right: 1px solid var(--dsw-alias-border-l1);
    }
    .omnimux-new-project-name input {
      flex: 1; border: 0; outline: 0; padding: 0 12px; font-size: 14px; background: transparent;
    }
    .omnimux-new-project-source-head {
      display: flex; align-items: center; justify-content: space-between; min-height: 20px;
    }
    .omnimux-new-project-source-label { font-size: 13px; font-weight: 500; color: var(--dsw-alias-label-secondary); }
    .omnimux-new-project-device { font-size: 12px; color: var(--dsw-alias-label-tertiary); }
    .omnimux-new-project-picked {
      display: flex; align-items: center; height: 40px; padding: 0 6px 0 12px;
      border: 1px solid var(--dsw-alias-border-l2); border-radius: 10px; gap: 8px;
    }
    .omnimux-new-project-picked-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .omnimux-workflow-form-error {
      margin: 0; font-size: 12px; color: var(--dsw-alias-state-error-primary);
    }
    .omnimux-workflow-dialog-footer {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;
    }
    button {
      height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .btn-outline { background: #fff; border: 1px solid var(--dsw-alias-border-l2); }
    .btn-primary { background: var(--dsw-alias-brand-primary); border: 0; color: #fff; }
    .btn-primary:disabled { opacity: .4; cursor: default; }
    .result {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      background: #eefbf3; color: #067647; font-size: 13px;
    }
    .result.show { display: block; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="dialog" role="dialog" aria-labelledby="title">
      <h1 class="dialog-title" id="title">创建项目</h1>
      <div class="omnimux-workflow-form">
        <div class="omnimux-new-project-name">
          <span class="omnimux-new-project-name-prefix" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v7A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5v-9Z"/></svg>
          </span>
          <input id="omnimux-new-local-project-name" value="视频代做" aria-label="项目名称" />
        </div>
        <div class="omnimux-new-project-source-head">
          <span class="omnimux-new-project-source-label">源文件夹</span>
          <span class="omnimux-new-project-device">此电脑</span>
        </div>
        <div class="omnimux-new-project-picked" data-omnimux-new-project-picked="">
          <span class="omnimux-new-project-picked-name" title="/Users/x/Desktop/Project/视频代做">视频代做</span>
        </div>
        <p class="omnimux-workflow-form-error" id="error" hidden></p>
        <p class="result" id="result" data-omnimux-page-added="">已在当前项目新建创作页。</p>
      </div>
      <div class="omnimux-workflow-dialog-footer">
        <button type="button" class="btn-outline">取消</button>
        <button type="button" class="btn-primary" id="submit" data-omnimux-create-submit="">创建项目</button>
      </div>
    </div>
  </div>
  <script>
    let confirmedExisting = false
    const errorEl = document.getElementById('error')
    const resultEl = document.getElementById('result')
    document.getElementById('submit').addEventListener('click', () => {
      if (!confirmedExisting) {
        confirmedExisting = true
        errorEl.hidden = false
        errorEl.textContent = '当前工作区已有项目，要在该项目新建创作页吗？'
        return
      }
      errorEl.hidden = true
      resultEl.classList.add('show')
    })
  </script>
</body>
</html>
