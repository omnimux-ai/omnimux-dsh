<!DOCTYPE html><html><head><style id="omx-user-attachments-styles">
.omx-user-attachments-rail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  justify-content: flex-start;
  align-self: flex-start;
  width: 100%;
  box-sizing: border-box;
}

/* OmniMux 已在上方挂紧凑素材轨时，隐藏官方大图附件行，避免同一份素材显示两次。 */
[data-message-attachments][data-omx-native-attachments-hidden="true"] {
  display: none !important;
}

.omx-user-att-card {
  position: relative;
  display: inline-flex;
  align-items: center;
  box-sizing: border-box;
  user-select: none;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.omx-user-att-card:hover {
  transform: translateY(-1px);
}

/* 图像与视频缩略图卡片 */
.omx-user-att-card--media {
  width: 44px;
  min-width: 44px;
  height: 44px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-2);
  cursor: pointer;
}

.omx-user-att-card--media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 视频播放小图标与角标 */
.omx-user-att-play-badge {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--dsw-alias-backdrop-overlay, rgba(0, 0, 0, 0.6)); /* exempt-ui03 半透明视频蒙层 */
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dsw-alias-label-primary-foreground, #ffffff); /* exempt-ui03 高反差图标色 */
  pointer-events: none;
}

.omx-user-att-play-badge svg {
  width: 10px;
  height: 10px;
  fill: currentColor;
  margin-left: 1px;
}

.omx-user-att-duration {
  position: absolute;
  bottom: 2px;
  right: 2px;
  font-size: 9px;
  line-height: 1;
  padding: 2px 3px;
  border-radius: 3px;
  background: var(--dsw-alias-backdrop-overlay, rgba(0, 0, 0, 0.7)); /* exempt-ui03 半透明时长角标底色 */
  color: var(--dsw-alias-label-primary-foreground, #ffffff); /* exempt-ui03 高反差文字色 */
  font-family: ui-monospace, monospace;
}

/* 文件/文档/表格/音频胶囊 */
.omx-user-att-card--file {
  height: 30px;
  padding: 0 10px 0 6px;
  gap: 6px;
  border-radius: 6px;
  border: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-2);
  cursor: default;
  max-width: 200px;
}

.omx-user-att-ext-badge {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--dsw-alias-bg-layer-3);
  color: var(--dsw-alias-label-secondary);
  flex-shrink: 0;
  font-family: ui-monospace, monospace;
}

.omx-user-att-title {
  font-size: 12px;
  line-height: 1;
  color: var(--dsw-alias-label-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style><style>
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:24px}

.omx-user-attachments-rail{display:flex;gap:8px;align-self:flex-start;width:100%}
.omx-user-att-card--media{width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid #333}
.omx-user-att-card--media img{width:100%;height:100%;object-fit:cover}
.bubble{background:#2a2a30;border-radius:22px;padding:10px 16px}
[data-message-attachments][data-omx-native-attachments-hidden="true"]{display:none!important}
.badge{display:inline-block;margin-top:16px;padding:6px 12px;border-radius:999px;background:#1f6f3a;font-size:13px}
h1{font-size:18px;margin:0 0 16px}
