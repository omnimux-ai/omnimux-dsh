<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一级入口全屏预演</title>
  <style>
    :root {
      --omx-violet-primary: #7961f2;
      --omx-violet-glow: rgba(121, 97, 242, 0.25);
      --omx-violet-soft: rgba(121, 97, 242, 0.12);
      --omx-control-height: 32px;
      --omx-radius-base: 8px;
      --omx-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html[data-theme="dark"] {
      --dsw-alias-bg-base: #111113;
      --dsw-alias-bg-layer-1: #18181b;
      --dsw-alias-bg-layer-2: #212124;
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.07);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
      --dsw-alias-label-primary: #ffffff;
      --dsw-alias-label-secondary: rgba(255, 255, 255, 0.70);
      --dsw-alias-label-tertiary: rgba(255, 255, 255, 0.38);
      --dsw-btn-primary-bg: #ffffff;
      --dsw-btn-primary-text: #111113;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--omx-font-family);
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 13px;
    }
    header {
      height: 48px;
      border-bottom: 1px solid var(--dsw-alias-border-l1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .brand { font-weight: 600; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--omx-violet-soft);
      color: var(--omx-violet-primary);
      border: 1px solid var(--omx-violet-glow);
    }
    .shell {
      flex: 1;
      display: grid;
      min-height: 0;
    }
    .shell.session-full { grid-template-columns: 220px 1fr 0px; }
    .shell.page-full { grid-template-columns: 220px 0px 1fr; }
    .shell.three { grid-template-columns: 220px 280px 1fr; }
    .col {
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--dsw-alias-border-l1);
    }
    .col.right { border-right: none; }
    .nav, .chat, .page {
      height: 100%;
      padding: 12px;
    }
    .nav { background: var(--dsw-alias-bg-layer-1); }
    .chat { background: var(--dsw-alias-bg-base); }
    .page { background: var(--dsw-alias-bg-layer-2); }
    .row {
      height: 32px;
      border-radius: 8px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .row:hover { background: rgba(255,255,255,0.06); }
    .row.active { background: rgba(255,255,255,0.08); }
    .btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-layer-1);
      color: inherit;
      cursor: pointer;
      margin-top: 8px;
    }
    .ink {
      background: var(--dsw-btn-primary-bg);
      color: var(--dsw-btn-primary-text);
      border: none;
    }
    .status {
      padding: 8px 20px;
      border-top: 1px solid var(--dsw-alias-border-l1);
      color: var(--dsw-alias-label-secondary);
      font-size: 12px;
    }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    p.muted { color: var(--dsw-alias-label-secondary); }
  </style>
</head>
<body>
  <header>
    <div class="brand">一级入口全屏预演</div>
    <span class="badge" id="layout-badge">会话全屏</span>
  </header>
  <div class="shell session-full" id="shell">
    <div class="col">
      <div class="nav">
        <div class="row" id="btn-new" data-entry="new">新对话</div>
        <div class="row" id="btn-sess-a" data-entry="sess-a">会话甲</div>
        <div class="row" id="btn-sess-b" data-entry="sess-b">会话乙（记过三栏）</div>
        <div class="row" id="btn-app" data-entry="app">应用 · 手机演示</div>
        <div class="row" id="btn-assets" data-entry="assets">资产库</div>
      </div>
    </div>
    <div class="col">
      <div class="chat">
        <h2>聊天</h2>
        <p class="muted" id="chat-copy">点新对话后这里铺满。</p>
      </div>
    </div>
    <div class="col right">
      <div class="page">
        <h2 id="page-title">右侧页面</h2>
        <p class="muted" id="page-copy">点应用或资产库后这里铺满。</p>
        <button class="btn ink" id="btn-open-chat" type="button">打开聊天（变成三栏）</button>
      </div>
    </div>
  </div>
  <div class="status" id="status">就绪。点左侧入口查看布局。</div>
  <script>
    const pages = { app: { title: '应用 · 手机演示' }, assets: { title: '资产库' } };
    const sessions = {
      'sess-a': { three: false },
      'sess-b': { three: true },
    };
    const pageMem = { app: false, assets: false };
    let layout = 'session-full';
    let currentPage = 'app';
    let currentSession = null;

    const shell = document.getElementById('shell');
    const badge = document.getElementById('layout-badge');
    const status = document.getElementById('status');
    const pageTitle = document.getElementById('page-title');
    const pageCopy = document.getElementById('page-copy');
    const chatCopy = document.getElementById('chat-copy');

    function setLayout(next, reason) {
      layout = next;
      shell.className = 'shell ' + next;
      const labels = { 'session-full': '会话全屏', 'page-full': '右侧全屏', three: '三栏' };
      badge.textContent = labels[next];
      status.textContent = reason;
      document.body.dataset.layout = next;
    }

    function enterPage(id) {
      currentPage = id;
      pageTitle.textContent = pages[id].title;
      if (pageMem[id]) {
        setLayout('three', '该页曾打开过聊天，恢复三栏');
        chatCopy.textContent = '边看页面边聊。';
      } else {
        setLayout('page-full', '第一次进该页：右侧全屏');
        pageCopy.textContent = pages[id].title + '铺满。点「打开聊天」才记住三栏。';
      }
    }

    function enterSession(id, isNew) {
      currentSession = id;
      if (isNew) {
        setLayout('session-full', '新对话：会话全屏，不继承上一条');
        chatCopy.textContent = '新对话是一张白纸。';
        return;
      }
      if (sessions[id]?.three) {
        setLayout('three', '该会话记过三栏，恢复三栏');
        chatCopy.textContent = '这个会话上次是三栏。';
      } else {
        setLayout('session-full', '点会话必须看见聊天：会话全屏');
        chatCopy.textContent = '聊天铺满。再点应用才恢复该页记忆。';
      }
    }

    document.getElementById('btn-new').onclick = () => enterSession('new', true);
    document.getElementById('btn-sess-a').onclick = () => enterSession('sess-a', false);
    document.getElementById('btn-sess-b').onclick = () => enterSession('sess-b', false);
    document.getElementById('btn-app').onclick = () => enterPage('app');
    document.getElementById('btn-assets').onclick = () => enterPage('assets');
    document.getElementById('btn-open-chat').onclick = () => {
      pageMem[currentPage] = true;
      if (currentSession && sessions[currentSession]) sessions[currentSession].three = true;
      setLayout('three', '亲手打开聊天：该页记住三栏');
      chatCopy.textContent = '下次再点这个页面仍是三栏。';
    };
  </script>
</body>
</html>
