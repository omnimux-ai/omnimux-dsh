<!doctype html>
<html lang="zh-CN" data-harness="canvas-composer-issue-1998">
<head>
<meta charset="utf-8">
<title>canvas composer projection rehearsal</title>
<style>
  /* 原生形态的最小还原：座席 sticky 贴会话列底，卡片自适应宽度 */
  html, body { margin: 0; height: 100%; background: #111113; color: #fff;
    font-family: -apple-system, "PingFang SC", sans-serif; }
  .dshDesktopFrame { display: flex; height: 100vh; }
  .leftRail { flex: 0 0 280px; background: #16161a; }
  .centerCol { flex: 0 0 670px; display: flex; flex-direction: column; }
  .dshDesktopConversationSurface { display: flex; flex-direction: column; flex: 1 1 auto; }
  [data-conversation-scroll] { flex: 1 1 auto; }
  [data-composer-seat] { position: sticky; bottom: 0; }
  [data-composer-card] { width: 640px; margin: 0 auto; background: #1c1c1f; padding: 8px 0; }
  .workbenchSurface { flex: 1 1 auto; position: relative; background: #0e0e10; }
</style>
<style id="production-under-test">
/* Middle conversation column — collapse layout width while projecting native composer fixed to canvas bottom.
   Excludes rightbar collapsed state so conversation remains fully visible when auxiliary panel is closed. */
html[data-omnimux-conversation-collapsed] .dshDesktopFrame:not([data-rightbar-collapsed="true"]) [class*="centerCol"],
html[data-omnimux-conversation-collapsed] .dshDesktopFrame:not([data-rightbar-collapsed="true"]) .dshDesktopConversationSurface,
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [class*="centerCol"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) .dshDesktopConversationSurface{
  flex:0 0 0!important;
  width:0!important;
  min-width:0!important;
  max-width:0!important;
  overflow:hidden!important;
  opacity:0!important;
  pointer-events:none!important;
}
html[data-omnimux-conversation-collapsed] .dshDesktopFrame:not([data-rightbar-collapsed="true"]) .dshDesktopConversationSurface,
html[data-omnimux-conversation-collapsed] .dshDesktopFrame:not([data-rightbar-collapsed="true"]) .dshDesktopConversationSurface > *,
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) .dshDesktopConversationSurface,
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) .dshDesktopConversationSurface > *,
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation"] > *,
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-phase="active"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-conversation-scroll]{
  overflow:hidden!important;
  pointer-events:none!important;
  visibility:hidden!important;
  opacity:0!important;
}
/* Hide only the message transcript stream and header bar while rightbar is open, keep composerSeat mounted and visible */
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation.session"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation.session.header"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation.header"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [data-slot="conversation.view"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) header[class*="header"],
html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])) [class*="widthHandle"]{
  display:none!important;
}
/* Native DSH composer floating dock — 图像画布 + 会话列不可见（右栏全屏，或会话栏折叠且右栏未收起）
   时投射到画布底端（紧凑靠底停靠）。展开会话栏即撤销投射：输入框本就在会话列里，
   投射会在同屏造出第二个输入框。 */
:is(html:has([data-omnimux-image-canvas][data-visible="true"]) .dshDesktopFrame[data-rightbar-fullscreen="true"], html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])):has([data-omnimux-image-canvas][data-visible="true"])) [data-composer-seat]{
  position:fixed!important;
  bottom:10px!important;
  left:var(--omnimux-sidebar-width, 280px)!important;
  right:0!important;
  width:auto!important;
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  z-index:100!important;
  pointer-events:auto!important;
  visibility:visible!important;
  opacity:1!important;
  background:transparent!important;
}
/* 左栏收起时全屏面板铺满 100vw（sidebar-toggle-topbar 的 5.2 规则），座席左基准归零。
   收起态由插件镜像到 html[data-omnimux-left-collapsed]；这里必须显式写完整选择器，
   不能把带 html 前缀的投射选择器再接在它后面——那会要求 html 是 html 的后代，
   整条规则永远不命中（聚合校验抓不到，只有真实浏览器会暴露）。 */
html[data-omnimux-left-collapsed]:has([data-omnimux-image-canvas][data-visible="true"]) .dshDesktopFrame[data-rightbar-fullscreen="true"] [data-composer-seat],
html[data-omnimux-left-collapsed][data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])):has([data-omnimux-image-canvas][data-visible="true"]) [data-composer-seat]{
  left:0!important;
}
:is(html:has([data-omnimux-image-canvas][data-visible="true"]) .dshDesktopFrame[data-rightbar-fullscreen="true"], html[data-omnimux-conversation-collapsed]:not(:has([data-rightbar-collapsed="true"])):has([data-omnimux-image-canvas][data-visible="true"])) [data-composer-card]{
  width:640px!important;
  max-width:min(640px, calc(100vw - var(--omnimux-sidebar-width, 280px) - 64px))!important;
  margin:0 auto!important;
  box-shadow:0 20px 48px var(--dsw-alias-bg-layer-1, rgba(0, 0, 0, 0.4))!important;
  border-radius:18px!important;
  pointer-events:auto!important;
  visibility:visible!important;
  opacity:1!important;
}
/* 收起后网格第三列会吃掉全部剩余宽度，而外壳的右栏面板是固定宽度 + 右对齐
   （left = 容器宽 − 面板宽）。不补这一条，面板左侧就会留下等宽黑空（实测 670px
   的「中间空白占位」）。这里的面板是 absolute、定位祖先是右栏容器本身——左栏可见时
   容器已在 x=280，因此只能用容器相对坐标 left:0（换算成视口坐标正好是左栏右端）；
   写成视口偏移会把左侧导航宽度算两遍，面板右移一个侧栏宽。
   必须排除全屏态面板：它是 position:fixed（视口坐标由 sidebar-toggle-topbar 的
   fullscreen 规则负责），误套容器坐标会让它左移一个侧栏宽、压住左侧导航。 */
html[data-omnimux-conversation-collapsed]:not([data-omnimux-left-collapsed]) .dshDesktopRightbarSurface [class*="_panel"]:not([data-sidebar-right-panel]):not([class*="bottom"]):not([class*="Hidden"]):not([data-sidebar-right-panel="fullscreen"]){
  left:0!important;
  right:0!important;
  width:auto!important;
  max-width:none!important;
}
html[data-omnimux-conversation-collapsed][data-omnimux-left-collapsed] .dshDesktopRightbarSurface [class*="_panel"]:not([data-sidebar-right-panel]):not([class*="bottom"]):not([class*="Hidden"]){
  left:0!important;
  right:0!important;
  width:100vw!important;
  max-width:none!important;
}
</style>
</head>
<body>
  <div class="dshDesktopFrame">
    <aside class="leftRail"></aside>
    <section class="centerCol">
      <div class="dshDesktopConversationSurface">
        <div data-conversation-scroll></div>
        <div data-composer-seat>
          <div data-composer-card>输入框卡片</div>
        </div>
      </div>
    </section>
    <main class="workbenchSurface">
      <div id="canvasStage" class="omx-media-viewer"></div>
    </main>
  </div>
</body>
</html>
