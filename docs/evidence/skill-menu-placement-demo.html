<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniMux 技能列表菜单位置与层级修复交互演示</title>
  <style>
    :root {
      --bg-primary: #18181b;
      --bg-card: #27272a;
      --bg-menu: #1f1f23;
      --border-color: #3f3f46;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .header-bar {
      width: 100%;
      max-width: 800px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .session-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .mode-switch {
      display: flex;
      gap: 12px;
      background: #27272a;
      padding: 4px;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .main-stage {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin-top: 60px;
    }

    /* 模拟输入框 */
    .composer-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px 12px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .composer-input-area {
      font-size: 15px;
      line-height: 24px;
      color: var(--text-primary);
      min-height: 56px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: var(--text-primary);
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.06); }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .model-selector {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 4 个 1:1 核心大胶囊按钮 */
    .pills-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 24px;
      position: relative;
      z-index: 120;
      width: 100%;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 18px;
      border-radius: 9999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* 技能列表菜单 */
    .skill-trigger-menu {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--bg-menu);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      width: 100%;
    }
    .menu-group-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      padding: 6px 12px 4px;
      letter-spacing: 0.5px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #2a2a2e;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .menu-item:hover {
      background: #323238;
      border-color: rgba(255,255,255,0.08);
    }
    .menu-item-icon {
      color: #a855f7;
    }
    .menu-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .menu-item-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* 修复前与修复后的对比样式 */
    /* 修复前：放在下方，且 z-index 仅为 80，被胶囊栏（120）压在底下 */
    .state-before .skill-trigger-menu {
      top: calc(100% + 6px);
      bottom: auto;
      z-index: 80;
    }
    /* 修复后：放在输入框上方（上一层），且 z-index 提升至 1000 */
    .state-after .skill-trigger-menu {
      bottom: calc(100% + 8px);
      top: auto;
      z-index: 1000;
    }

    .callout-box {
      width: 100%;
      max-width: 800px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 24px;
      font-size: 13px;
      line-height: 1.6;
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="session-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
      <span>视频代做</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="mode-switch">
      <button class="mode-btn" id="btn-before" onclick="setMode('before')">修复前问题状态 (重叠遮挡)</button>
      <button class="mode-btn active" id="btn-after" onclick="setMode('after')">修复后状态 (显示在上方)</button>
    </div>
  </div>

  <div class="main-stage state-after" id="stage-container">
    
    <!-- 输入框 -->
    <div class="composer-card" id="composer-card">
      
      <!-- 技能列表菜单 -->
      <div class="skill-trigger-menu" id="skill-menu">
        <div class="menu-group-title">技能</div>
        <div class="menu-item">
          <div class="menu-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
          </div>
          <div>
            <div class="menu-item-title">tiktok-shop-product-video-maker</div>
            <div class="menu-item-desc">使用 AI 将商品信息、产品图、卖点制作成 TikTok Shop 爆款商品视频方案。</div>
          </div>
        </div>
      </div>

      <div class="composer-input-area">
        <span>/tiktok-shop-product-video-mak</span>
        <span class="typing-cursor"></span>
      </div>

      <div class="composer-toolbar">
        <div class="toolbar-left">
          <button class="tool-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <button class="tool-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>产品</span>
          </button>
        </div>
        <div class="toolbar-right">
          <div class="model-selector">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="16" x="4" y="4" rx="2"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/></svg>
            <span>Gemini 3.8 Flash Max</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <button class="send-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 4 个核心胶囊按钮 -->
    <div class="pills-bar">
      <button class="pill-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>技能</span>
      </button>
      <button class="pill-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>视频广告</span>
      </button>
      <button class="pill-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>图片广告</span>
      </button>
      <button class="pill-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>竞争对手研究</span>
      </button>
    </div>

  </div>

  <div class="callout-box" id="info-callout">
    <strong>✨ 优化效果说明：</strong><br>
    • <strong>位置定位</strong>：技能列表菜单已稳定置于输入框上方（上一层），输入框正下方的 4 个核心快捷胶囊按钮完整呈现，不再与菜单重叠。<br>
    • <strong>图层层级</strong>：菜单图层置顶为 <code>z-index: 1000</code>，彻底消除了原先由于 80 &lt; 120 导致的被按钮遮挡压制问题。
  </div>

  <script>
    function setMode(mode) {
      const stage = document.getElementById('stage-container');
      const btnBefore = document.getElementById('btn-before');
      const btnAfter = document.getElementById('btn-after');
      const callout = document.getElementById('info-callout');

      if (mode === 'before') {
        stage.className = 'main-stage state-before';
        btnBefore.className = 'mode-btn active';
        btnAfter.className = 'mode-btn';
        callout.innerHTML = '<strong>⚠️ 修复前异常：</strong>菜单被强行放在输入框下方，且 z-index 仅为 80，被下方层级为 120 的快捷胶囊按钮硬生生盖在底下，导致技能信息无法看清。';
      } else {
        stage.className = 'main-stage state-after';
        btnAfter.className = 'mode-btn active';
        btnBefore.className = 'mode-btn';
        callout.innerHTML = '<strong>✨ 优化效果说明：</strong><br>• <strong>位置定位</strong>：技能列表菜单已稳定置于输入框上方（上一层），输入框正下方的 4 个核心快捷胶囊按钮完整呈现，不再与菜单重叠。<br>• <strong>图层层级</strong>：菜单图层置顶为 <code>z-index: 1000</code>，彻底消除了原先由于 80 < 120 导致的被按钮遮挡压制问题。';
      }
    }
  </script>
</body>
</html>
