# 音频模型能力契约 (Audio Models Capability Contract)
# Seed Audio 使用同步 speech；suno / gpt-4o-mini-tts 保留 draft+stub。
# whisper-1 产出 text，不进入 audio 产出桶。
schemaVersion: "1.1"
managementGroup: "audio"
modality: "audio"

models:
  - id: "doubao-asr-bigmodel"
    label: "豆包语音识别大模型 (Doubao-ASR)"
    family: "bytedance"
    badge: "语音识别"
    subtitle: "豆包音频转写 · 文本 / SRT / VTT"
    operations:
      - id: "speech_to_text"
        label: "语音转文字"
        listed: true
        output: { type: "text" }
        inputs:
          - { slot: "audio_input", type: "audio", role: "source", source: "upstream_edge", min: 1, max: 1 }
    parameters:
      response_format:
        options: ["json", "text", "verbose_json", "srt", "vtt"]
        defaultValue: "json"
    research:
      status: "verified"
      docUrl: "docs/evidence/2026-09-07-model-doubao-asr-bigmodel-speech_to_text.md"
      verifiedAt: "2026-09-07"
      notes: "Issue #744 提供的中枢接入契约；离线验证范围与未核验项见证据文档"
    implementation:
      status: "ready"
      profileId: "speechToText"
      seam: "speechToText"
    execution:
      status: "live"
      profileId: "speechToText"
      seam: "speechToText"
      notes: "按 #744 指定状态登记；本轮仅离线验证，不声明独立真实调用成功"

  # #1789：seedasr-auc 是上游独立在售的语音识别型号（官方直连-火山 渠道 43，upstream_id 与公开 ID 相同），
  # 与 doubao-asr-bigmodel 不是同一模型，二者互不归一（bigasr-auc 档案 notes 明写「不要与 seedasr-auc 混用」）。
  # 本 ID 只以 canonical 身份登记，且不得出现在任何模型的 aliases[] 中。
  - id: "seedasr-auc"
    label: "Seed ASR 2.0 语音识别"
    family: "bytedance"
    badge: "语音识别"
    subtitle: "火山引擎 Seed ASR 2.0 · 录音文件识别标准模式"
    operations:
      - id: "speech_to_text"
        label: "语音转文字"
        listed: true
        output: { type: "text" }
        inputs:
          - slot: "audio_input"
            type: "audio"
            role: "source"
            source: "upstream_edge"
            min: 1
            max: 1
            limitSource:
              kind: "official_docs"
              url: "https://docs.byteplus.com/en/docs/byteplusvoice/asraudiofile"
              note: "官方限制：文件 < 512MB、时长 < 5 小时（原文 File Size | < 512MB、Audio Duration | < 5 hours，均为严格小于）。本行不写 maxSizeMb/maxDurationSec 上限：URL-first 提交没有本地字节与时长，声明上限会让每次 URL 提交在 METADATA_UNKNOWN 上被拒。本模型上限有官方确定值（上游档案 max_input_bytes=536870912、max_input_seconds=18000、编码 8 项），不声明是主动取舍；doubao-asr-bigmodel 不声明则是上限未知（其档案 max_input_bytes/max_input_seconds 记 null、input_formats 记空数组），两者证据等级不同，不可类比。支持的编码官方列为 OPUS、WAV、MP3、SPX、OGG、AMR、AAC、M4A。"
    parameters:
      response_format:
        options: ["json", "text", "verbose_json", "srt", "vtt"]
        defaultValue: "json"
    research:
      status: "verified"
      docUrl: "https://docs.byteplus.com/en/docs/byteplusvoice/asraudiofilesubmittask"
      verifiedAt: "2026-09-14"
      notes: "官方出处为字节跳动 BytePlus（Seed Speech）文档：X-Api-Resource-Id 取值 volc.seedasr.auc 与本 ID 逐字对应，即 Seed ASR 2.0 录音文件识别标准模式（异步转写，提交后查询结果）。上游档案记 status=documented、vendor_model_id=volc.seedasr.auc，并绑定 [官方直连-火山] Seed Audio 豆包语音 渠道（upstream_id 与公开 ID 相同）。与 doubao-asr-bigmodel 不可互相归一：该档案自认「是否等价于 Seed ASR 资源 ID 未确认」，bigasr-auc 档案 notes 亦明写「不要与 seedasr-auc 混用」。本轮不发起真实模型调用。"
    implementation:
      status: "ready"
      profileId: "speechToText"
      seam: "speechToText"
    execution:
      status: "live"
      profileId: "speechToText"
      seam: "speechToText"
      notes: "复用已挂载且 live 的 speechToText profile/seam；运行期本 ID 走 URL-first 直传（src/media/stt.js URL_FIRST_MODELS）。execution=live 表示该 ID 挂在 live 执行通道上；本轮不发起真实模型调用，不声明独立真实执行结论。"

  - id: "seed-audio-1.0"
    label: "Seed Audio 1.0"
    family: "bytedance"
    badge: "语音合成"
    subtitle: "火山引擎 / 豆包大模型语音合成 · 509+ 精品音色"
    aliases: ["doubao-seed-audio-1.0", "seed-audio", "tts"]
    operations:
      - id: "text_to_speech"
        label: "文本转语音"
        listed: true
        output: { type: "audio" }
        inputs:
          - { slot: "prompt", type: "text", role: "prompt", source: "node_field", min: 1, max: 1 }
    parameters:
      voice:
        # Resolved by the catalog loader; the DTO and SubmitGuard share one index.
        optionsFrom: "volcengine-voice-index"
        defaultValue: "zh_male_guanggaojieshuo_uranus_bigtts"
      speed:
        # Require a finite number without inventing undocumented bounds.
        range: {}
        defaultValue: 1.0
      format:
        options: ["mp3", "wav", "pcm"]
        defaultValue: "mp3"
    research:
      status: "verified"
      docUrl: "docs/evidence/2026-09-18-model-seed-audio-1-0-text_to_speech-live.md"
      verifiedAt: "2026-09-18"
      notes: "火山引擎 HTTP v3 语音合成接口网关真实执行与创作画布端到端验收通过（见 live 证据文档）"
    implementation:
      status: "ready"
      profileId: "audioGenerate"
      seam: "audioGenerate"
    execution:
      status: "live"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "同步 POST /v1/audio/speech 管道（2026-09-18 实测 200 返回 MP3 音频与元数据）"

  # #2256：Index TTS 声音克隆。渠道官方文档只声明「参考音 + 文稿」两个必填节点，
  # 且端点走视频任务通道（GxgenAI 任务共用 /v1/video/generations，即使产物是音频）。
  # 本行的 prompt 槽承载「要朗读的文稿」，对应文档节点 7/text；文档中非必填的顶层
  # `prompt`（"仅作标签"）不是本槽，登记时不发送。参考音对应节点 4/audio。
  - id: "index-tts"
    label: "Index TTS2 声音克隆"
    family: "indextts"
    badge: "声音克隆"
    subtitle: "Index TTS2 · 参考音 + 文稿直出克隆音色"
    operations:
      - id: "voice_clone"
        label: "声音克隆"
        listed: true
        output: { type: "audio" }
        inputs:
          - { slot: "prompt", type: "text", role: "prompt", source: "node_field", min: 1, max: 1 }
          - { slot: "voice_sample", type: "audio", role: "audio_track", source: "upstream_edge", min: 1, max: 1 }
    parameters: {}
    research:
      status: "verified"
      docUrl: "https://docs.omnimux.ai/zh/api-reference/audio-series/models/index-tts"
      verifiedAt: "2026-09-18"
      notes: "渠道官方文档 docs/zh/api-reference/audio-series/models/index-tts.mdx（本机 OmniMux-docs 仓）；changelog 2026-08-16-index-tts-ltx-docs 记为已上架。文档硬约束：必填 metadata.nodeInfoList，节点 4/audio 为克隆参考音（服务端自动截取前约 15 秒）、节点 7/text 为朗读文字；参考音须公网 URL 或上游 fileName，不得传 data: URI；轮询用 GET /v1/video/generations/{task_id}，不得使用 *-async / *-query 模型名。输出格式与参考音时长上限文档未写，不推断。"
    implementation:
      status: "ready"
      profileId: "audioGenerate"
      seam: "audioGenerate"
    execution:
      status: "stub"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "本轮只做离线请求构造与轮询夹具验证，未发起真实模型调用；上线前按模型接口准据补真实执行证据。"

  - id: "suno"
    label: "Suno Music"
    family: "suno"
    badge: "音乐创作"
    subtitle: "AI 歌曲 / 纯音乐 · ⏱ 30-120s"
    operations:
      - id: "text_to_music"
        label: "AI 音乐生成"
        output:
          type: "audio"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
    parameters:
      duration:
        options:
          - { value: 30, label: "30s" }
          - { value: 60, label: "60s" }
          - { value: 120, label: "120s" }
        defaultValue: 60
        unit: "s"
      instrumental:
        supported: true
        defaultValue: false
    research:
      status: "draft"
      notes: "runtime AUDIO 目录有 suno；仓内无 dated live 证据，不上架"
    implementation:
      status: "none"
    execution:
      status: "stub"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "stub only；不得宣称 live"

  - id: "gpt-4o-mini-tts"
    label: "GPT 4o Mini TTS"
    family: "openai"
    badge: "语音合成"
    subtitle: "OpenAI 高清配音 · 6 种音色"
    operations:
      - id: "text_to_speech"
        label: "文本转语音"
        output:
          type: "audio"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
    parameters:
      voice:
        options:
          - { value: "alloy", label: "Alloy (自然通用)" }
          - { value: "echo", label: "Echo (沉稳男声)" }
          - { value: "fable", label: "Fable (英式叙事)" }
          - { value: "onyx", label: "Onyx (深沉厚重)" }
          - { value: "nova", label: "Nova (明亮女声)" }
          - { value: "shimmer", label: "Shimmer (清亮柔和)" }
        defaultValue: "alloy"
    research:
      status: "draft"
      notes: "runtime AUDIO 目录存在；仓内无 dated live 证据，不上架"
    implementation:
      status: "none"
    execution:
      status: "stub"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "stub only；不得宣称 live"

  - id: "whisper-1"
    label: "Whisper 1"
    family: "openai"
    badge: "语音识别"
    subtitle: "OpenAI 语音转文字 / ASR"
    operations:
      - id: "speech_to_text"
        label: "语音识别"
        output:
          type: "text"
        inputs:
          - slot: "audio_input"
            type: "audio"
            role: "source"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["audio/mp3", "audio/wav", "audio/m4a", "audio/webm"]
            maxSizeMb: 25
            limitSource:
              kind: "policy_conservative"
              note: "OpenAI Whisper common 25MB class; seam not live in hub"
    parameters: {}
    research:
      status: "draft"
      notes: "draft 处置：speech_to_text output 为 text；speechToText seam 已挂载（#538）可探测；promptPolicy=none；#530 探测翻 live"
    implementation:
      status: "none"
    execution:
      status: "none"
      profileId: "speechToText"
      seam: "speechToText"
      notes: "speechToText profile live（seam 已挂载）；模型级 execution 待 #530 探测证据方可翻 live"
