# 音频模型能力契约 (Audio Models Capability Contract)
# Seed Audio 使用同步 speech；suno / gpt-4o-mini-tts 保留 draft+stub。
# whisper-1 产出 text，不进入 audio 产出桶。
schemaVersion: "1.1"
managementGroup: "audio"
modality: "audio"

models:
  - id: "seed-audio-1.0"
    label: "Seed Audio 1.0"
    family: "bytedance"
    badge: "语音合成"
    subtitle: "火山引擎 / 豆包大模型语音合成 · 509+ 精品音色"
    aliases: ["doubao-seed-audio-1.0", "seed-audio"]
    operations:
      - id: "text_to_speech"
        label: "文本转语音"
        listed: true
        output: { type: "audio" }
        inputs:
          - { slot: "prompt", type: "text", role: "prompt", source: "node_field", min: 1, max: 1 }
    parameters:
      voice:
        # Resolved by the catalog loader; the DTO and SubmitGuard share one index.
        optionsFrom: "volcengine-voice-index"
        defaultValue: "zh_male_guanggaojieshuo_uranus_bigtts"
      speed:
        # Require a finite number without inventing undocumented bounds.
        range: {}
        defaultValue: 1.0
      format:
        options: ["mp3", "wav", "pcm"]
        defaultValue: "mp3"
    research:
      status: "verified"
      docUrl: "docs/evidence/2026-09-07-model-seed-audio-1.0-text_to_speech.md"
      verifiedAt: "2026-09-07"
      notes: "火山引擎 HTTP v3 语音合成接口接入已在网关验证"
    implementation:
      status: "ready"
      profileId: "audioGenerate"
      seam: "audioGenerate"
    execution:
      status: "live"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "同步 POST /v1/audio/speech 管道"

  - id: "suno"
    label: "Suno Music"
    family: "suno"
    badge: "音乐创作"
    subtitle: "AI 歌曲 / 纯音乐 · ⏱ 30-120s"
    operations:
      - id: "text_to_music"
        label: "AI 音乐生成"
        output:
          type: "audio"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
    parameters:
      duration:
        options:
          - { value: 30, label: "30s" }
          - { value: 60, label: "60s" }
          - { value: 120, label: "120s" }
        defaultValue: 60
        unit: "s"
      instrumental:
        supported: true
        defaultValue: false
    research:
      status: "draft"
      notes: "runtime AUDIO 目录有 suno；仓内无 dated live 证据，不上架"
    implementation:
      status: "none"
    execution:
      status: "stub"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "stub only；不得宣称 live"

  - id: "gpt-4o-mini-tts"
    label: "GPT 4o Mini TTS"
    family: "openai"
    badge: "语音合成"
    subtitle: "OpenAI 高清配音 · 6 种音色"
    operations:
      - id: "text_to_speech"
        label: "文本转语音"
        output:
          type: "audio"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
    parameters:
      voice:
        options:
          - { value: "alloy", label: "Alloy (自然通用)" }
          - { value: "echo", label: "Echo (沉稳男声)" }
          - { value: "fable", label: "Fable (英式叙事)" }
          - { value: "onyx", label: "Onyx (深沉厚重)" }
          - { value: "nova", label: "Nova (明亮女声)" }
          - { value: "shimmer", label: "Shimmer (清亮柔和)" }
        defaultValue: "alloy"
    research:
      status: "draft"
      notes: "runtime AUDIO 目录存在；仓内无 dated live 证据，不上架"
    implementation:
      status: "none"
    execution:
      status: "stub"
      profileId: "audioGenerate"
      seam: "audioGenerate"
      notes: "stub only；不得宣称 live"

  - id: "whisper-1"
    label: "Whisper 1"
    family: "openai"
    badge: "语音识别"
    subtitle: "OpenAI 语音转文字 / ASR"
    operations:
      - id: "speech_to_text"
        label: "语音识别"
        output:
          type: "text"
        inputs:
          - slot: "audio_input"
            type: "audio"
            role: "source"
            source: "upstream_edge"
            min: 1
            max: 1
            allowedMimes: ["audio/mp3", "audio/wav", "audio/m4a", "audio/webm"]
            maxSizeMb: 25
            limitSource:
              kind: "policy_conservative"
              note: "OpenAI Whisper common 25MB class; seam not live in hub"
    parameters: {}
    research:
      status: "draft"
      notes: "draft 处置：speech_to_text output 为 text；speechToText seam 已挂载（#538）可探测；promptPolicy=none；#530 探测翻 live"
    implementation:
      status: "none"
    execution:
      status: "none"
      profileId: "speechToText"
      seam: "speechToText"
      notes: "speechToText profile live（seam 已挂载）；模型级 execution 待 #530 探测证据方可翻 live"
