# #530 的七款型号固定走 APIMart；模式、输入和参数上限来自对应官方接口页。
# 文档支持、实现就绪与历史真实执行分别记录；本轮不发真实生成请求。
# 其他历史型号保留原状态，不纳入本阶段接入范围。
schemaVersion: "1.1"
managementGroup: "video"
modality: "video"

models:
