    family: bytedance
    badge: 快速
    subtitle: 480p/720p · 4–15s · 有声
    aliases:
      - seedance-2.0-fast
    routing:
      channel: apimart
      wireModel: seedance-2.0-fast
      endpoint: /v1/videos/generations
      automaticFallback: false
    operations:
      - id: text_to_video
        label: 文生视频
        output:
          type: video
          allowedMimes:
            - video/mp4
            - video/quicktime
        inputs:
          - slot: prompt
            type: text
            role: prompt
            source: node_field
            min: 1
            max: 1
        execution:
          status: live
          profileId: videoGenerate
          seam: videoGenerate
          notes: 保留既有历史真实执行证据；本轮未新增真实请求
      - id: first_frame
        label: 首帧
        output:
          type: video
          allowedMimes:
            - video/mp4
            - video/quicktime
        inputs:
          - slot: prompt
            type: text
            role: prompt
            source: node_field
            min: 0
            max: 1
          - slot: first_frame
            type: image
            role: first_frame
            source: upstream_edge
            min: 1
            max: 1
            limitSource:
              kind: official_docs
              url: https://docs.apimart.ai/en/api-reference/videos/seedance-2-0/generation.md
        execution:
