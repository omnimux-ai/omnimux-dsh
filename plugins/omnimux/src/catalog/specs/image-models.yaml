schemaVersion: "1.1"
managementGroup: "image"
modality: "image"

models:

  - id: "gpt-image-2.5-hd"
    label: "GPT Image 2.5 HD"
    family: "openai"
    subtitle: "高清 4K"
    operations:
      - id: "text_to_image"
        label: "文生图"
        output:
          type: "image"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
      - id: "multi_reference"
        label: "垫图参考"
        output:
          type: "image"
        inputs:
          - slot: "prompt"
            type: "text"
            role: "prompt"
            source: "node_field"
            min: 1
            max: 1
          - slot: "reference_image"
            type: "image"
            role: "reference"
            source: "upstream_edge"
            min: 0
            max: 1
            allowedMimes: ["image/png", "image/jpeg", "image/webp"]
            maxSizeMb: 10
            limitSource:
              kind: "policy_conservative"
              note: "继承 runtime 表行 max1；官方审计前保守"
