          status: "ready"
          profileId: "imageGenerate"
          seam: "imageGenerate"
          notes: "已落地 Edits 路由与发包映射"
    parameters:
      aspectRatio:
        options:
          - { value: "auto", label: "自适应" }
          - { value: "1:1", label: "1:1" }
          - { value: "16:9", label: "16:9" }
          - { value: "9:16", label: "9:16" }
          - { value: "4:3", label: "4:3" }
          - { value: "3:4", label: "3:4" }
          - { value: "3:2", label: "3:2" }
          - { value: "2:3", label: "2:3" }
