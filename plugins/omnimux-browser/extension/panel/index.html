<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16161b" />
    <title>OmniMux-精灵助手</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0e;
        color: #f2f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", sans-serif;
      }
      .panel-boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
        color: #94a3b8;
        font-size: 13px;
      }
      .boot-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="panel-boot-loading">
        <div class="boot-spinner"></div>
        <span>OmniMux 载入中...</span>
      </div>
    </div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
