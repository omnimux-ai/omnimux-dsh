packages:
  - plugins/*
  - packages/*
  - plugins/omnimux-browser/extension

peerDependencyRules:
  allowedVersions:
    "@deepseek-ai/dsh-*": "0.2.1-rc.3"
    "@deepseek-ai/cordis": "4.0.2"

overrides:
  '@deepseek-ai/dsh-*': 0.2.1-rc.3

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - aigc-provider-runtime-kit@0.2.0
  - blobatar@0.2.0
