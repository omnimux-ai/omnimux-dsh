name: Quality Gate & Auto QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Static L0 QA & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QA verifier dependencies
        run: |
          set -euo pipefail
          QA_DEPS="$(mktemp -d)"
          export QA_DEPS
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { devDependencies } = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync(process.env.QA_DEPS + '/package.json', JSON.stringify({
            private: true,
            dependencies: { acorn: devDependencies.acorn, esbuild: devDependencies.esbuild, pngjs: devDependencies.pngjs },
          }));
          JS
          npm --prefix "$QA_DEPS" install --ignore-scripts --no-audit --no-fund
          test ! -e node_modules
          ln -s "$QA_DEPS/node_modules" node_modules

      - name: Run syntax & contract gates
        run: |
          node --check scripts/auto-qa-gate.mjs
          node --check scripts/auto-pipeline.mjs
          node --check scripts/pipeline-state.mjs
          node --check scripts/ci-verdict.mjs
          node --check scripts/check-tracked-artifacts.mjs
          node --check scripts/verify-model-contracts.mjs
          bash -n scripts/git-wt.sh
          bash -n scripts/ego-browser-qa.sh
          bash -n scripts/materialize-with-rollback.sh

      - name: Forbid tracked omnimux-workflow artifacts
        run: node scripts/check-tracked-artifacts.mjs

      - name: Run diff-aware L0 static QA
        run: |
          mkdir -p .workbuddy/evidence
          node scripts/auto-qa-gate.mjs . --diff --base origin/main --json --output .workbuddy/evidence/auto-qa-report.json

      - name: Run regression tests
        run: |
          node --test scripts/auto-pipeline.test.mjs scripts/check-tracked-artifacts.test.mjs scripts/live-runtime-proof.test.mjs scripts/repair-inspiration-covers.test.mjs

      - name: Verify model contracts (admission + dispositions strict)
        run: |
          set -euo pipefail
          # Isolate yaml install: full monorepo pnpm install needs local file: dsh-ui-kit.
          # trap ensures symlink/tmpdir cleanup even when verifier fails.
          TMP="$(mktemp -d)"
          YAML_LINK=""
          cleanup() {
            if [[ -n "${YAML_LINK}" && -L "${YAML_LINK}" ]]; then
              rm -f "${YAML_LINK}"
            fi
            rm -rf "${TMP}"
          }
          trap cleanup EXIT
          printf '%s\n' '{"type":"module","dependencies":{"yaml":"2.9.0"}}' > "$TMP/package.json"
          npm --prefix "$TMP" install --ignore-scripts --no-audit --no-fund
          mkdir -p plugins/omnimux/node_modules
          YAML_LINK="plugins/omnimux/node_modules/yaml"
          # Prefer NODE_PATH when a real yaml install already exists; never clobber it.
          if [[ -e "${YAML_LINK}" && ! -L "${YAML_LINK}" ]]; then
            export NODE_PATH="${TMP}/node_modules${NODE_PATH:+:$NODE_PATH}"
            YAML_LINK=""
            node scripts/verify-model-contracts.mjs --strict
          else
            ln -sfn "$TMP/node_modules/yaml" "${YAML_LINK}"
            node scripts/verify-model-contracts.mjs --strict
          fi

      - name: Rebuild omnimux-workflow host bundle from src
        run: |
          TMP="$(mktemp -d)"
          printf '%s\n' '{"type":"module"}' > "$TMP/package.json"
          npm --prefix "$TMP" install --ignore-scripts --no-audit --no-fund esbuild@0.28.2 zod @xyflow/react uuid
          ln -sfn "$TMP/node_modules" plugins/omnimux-workflow/node_modules
          node plugins/omnimux-workflow/scripts/build-host.mjs
          test -s plugins/omnimux-workflow/dist/index.js
          rm -f plugins/omnimux-workflow/node_modules
          rm -rf "$TMP"

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: .workbuddy/evidence/
          retention-days: 7

      - name: Evaluate CI verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/ci-verdict.mjs \
            --report .workbuddy/evidence/auto-qa-report.json \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '--dry-run' }}
