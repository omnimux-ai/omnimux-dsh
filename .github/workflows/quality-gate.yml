name: Quality Gate & Auto QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-tests:
    name: Static L0 QA & Tests
    runs-on: ubuntu-latest
    env:
      QA_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Clear stale QA label
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module - <<'JS'
          import { syncQaPassLabel } from './scripts/qa-label.mjs';
          const result = syncQaPassLabel({ prNumber: process.env.PR_NUMBER, pass: false });
          if (!result.ok) throw new Error(result.errors.join('; '));
          JS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      # 真实工作区安装：QA_DEPS 临时目录方案无法解析 file: 工作区依赖
      # （packages/dsh-ui-kit），且与锁文件漂移；prepare 脚本产物均已入库，
      # --ignore-scripts 安全且避开 prepare=build 全量重编。
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all plugin bundles
        run: node scripts/build-all.mjs

      - name: Run syntax & contract gates
        run: |
          node --check scripts/auto-qa-scan.mjs
          node --check scripts/auto-qa-gate.mjs
          node --check scripts/auto-pipeline.mjs
          node --check scripts/pipeline-state.mjs
          node --check scripts/ci-verdict.mjs
          node --check scripts/impact-matrix.mjs
          node --check scripts/authorization.mjs
          node --check scripts/qa-label.mjs
          node --check scripts/check-tracked-artifacts.mjs
          node --check scripts/verify-model-contracts.mjs
          node --check scripts/verify-cross-plugin-model-alignment.mjs
          node --check scripts/verify-product-baseline.mjs
          bash -n scripts/git-wt.sh
          node --check scripts/ego-live-qa.mjs
          node --check scripts/ego-browser-page.mjs
          node --check scripts/live-page-preparation.mjs
          node --check scripts/live-qa-request.mjs
          node --check scripts/live-browser-utils.mjs
          bash -n scripts/materialize-with-rollback.sh
          node --check scripts/verify-skill-bilingual.mjs
          node --check scripts/generate-featured-skills.mjs
          node scripts/verify-plugin-agent-tools.mjs

      # 三分栏收起布局契约门禁：列宽胜负取决于 CSS 层叠（重要性→特异性→顺序），
      # 源码正则断言只证明规则存在、不证明规则胜出。契约：docs/contracts/three-column-layout.md。
      - name: Three-column layout contract gate
        run: node --test plugins/omnimux/src/client/three-column-layout-contract.test.js

      - name: Forbid tracked omnimux-workflow artifacts
        run: node scripts/check-tracked-artifacts.mjs

      # 仓库静态门禁：插件边界、双语配对、AGENTS.md 预算与链接（侧栏契约需 dsh-ui-kit 实物依赖，暂不入此环境）。
      # 静默吞错为告警档（恒以成功状态退出，只打印存量清单），豁免清单出现僵尸条目才失败。
      - name: Repo gate scripts (boundaries, bilingual, AGENTS.md)
        run: |
          node scripts/verify-plugin-boundaries.mjs
          node scripts/verify-bilingual-docs.mjs
          node scripts/verify-silent-catch.mjs
          node --test scripts/verify-silent-catch.test.mjs
          node --test scripts/verify-agents-md.test.mjs
          node --test scripts/verify-governance-registry.test.mjs scripts/lib/governance-registry.test.mjs
          node --test scripts/guard-anti-cheat.test.mjs

      # 侧栏契约门禁：真实装配 8 个 Stage + market 全生命周期（JSDOM + 真实
      # dsh-ui-kit 缝位）。file: 依赖在全仓 install 下可解析、kit lib 产物已
      # 入库，concat-client 于 CI 可运行；此处挡回归只在本地 test:gates。
      - name: Stage & sidebar contract gate
        run: node scripts/verify-stage-contracts.mjs

      # 产品基线：产品路径不得依赖开发机私有状态（合同 docs/contracts/product-baseline.md）。
      - name: Product baseline gate (no dev-machine state in product paths)
        run: |
          node scripts/verify-product-baseline.mjs
          node --test scripts/verify-product-baseline.test.mjs

      - name: Run diff-aware L0 static QA
        run: |
          mkdir -p .workbuddy/evidence
          node scripts/auto-qa-gate.mjs . --diff --base "$QA_BASE" --json --output .workbuddy/evidence/auto-qa-report.json

      # 主干全仓巡检：不受 git diff 限制，覆盖插件源码的变形凭据与扩展清单的联网出口。
      # 不写 --output，避免覆盖上面那份 verdict 输入的 diff 报告。
      - name: Full-repo secret & extension outbound scan (push to main)
        if: ${{ github.event_name == 'push' }}
        run: node scripts/auto-qa-gate.mjs . --all

      - name: Setup Python for managed archives
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Test managed tarball unit suite
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/managed-tarball-home"
          export TMPDIR="$RUNNER_TEMP/managed-tarball-tmp"
          export COREPACK_HOME="$RUNNER_TEMP/managed-tarball-corepack"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache" XDG_STATE_HOME="$HOME/state"
          export npm_config_userconfig="$HOME/empty-user.npmrc" npm_config_globalconfig="$HOME/empty-global.npmrc"
          export npm_config_cache="$HOME/npm-cache" npm_config_store_dir="$HOME/store" npm_config_global_dir="$HOME/global"
          export COREPACK_DEFAULT_TO_LATEST=0 COREPACK_ENABLE_AUTO_PIN=0
          export npm_config_manage_package_manager_versions=false npm_config_verify_deps_before_run=false
          unset NODE_OPTIONS NODE_PATH PNPM_HOME NPM_CONFIG_USERCONFIG NPM_CONFIG_GLOBALCONFIG
          mkdir -p "$HOME" "$TMPDIR" "$COREPACK_HOME"
          printf '' > "$npm_config_userconfig"
          printf '' > "$npm_config_globalconfig"
          corepack prepare pnpm@11.7.0 --activate
          export COREPACK_ENABLE_NETWORK=0
          test "$(corepack pnpm --version)" = 11.7.0
          corepack pnpm --config.verify-deps-before-run=false test:managed-tarball:unit

      - name: Verify form contracts, authoring tools and generated references
        run: pnpm --config.verify-deps-before-run=false verify:forms

      - name: Verify task form runtime and protected draft handoff
        run: node --test plugins/omnimux-forms/src/*.test.mjs plugins/omnimux-forms/src/client/*.test.mjs plugins/omnimux/src/host/form-attachments*.test.js plugins/omnimux/src/client/forms/*.test.js

      - name: Prepare small public evidence data repository
        run: |
          set -euo pipefail
          no_link_directory() {
            local path="$1"
            test "$(realpath -e -- "$path")" = "$path" || return
            while :; do
              test -d "$path" && test ! -L "$path" || return
              test "$path" != / || break
              path="$(dirname -- "$path")"
            done
          }
          parent="$(realpath -e -- "${RUNNER_TEMP:?}")"
          no_link_directory "$parent"
          fixture="$(mktemp -d "$parent/evidence-contract-XXXXXX")"
          phase=created
          identity=''
          preparation_exit() {
            local source_exit=$?
            trap - EXIT
            if no_link_directory "$fixture" && test -n "$identity" && test "$(stat -c '%d:%i' -- "$fixture")" = "$identity"; then
              printf 'preparation_phase=%s\npreparation_exit=%s\n' "$phase" "$source_exit" >> "$fixture/owner-receipt.txt"
            else
              printf 'Preparation receipt identity unconfirmed; always cleanup must retain owner\n' >&2
              test "$source_exit" -ne 0 || source_exit=1
            fi
            exit "$source_exit"
          }
          trap preparation_exit EXIT
          # Record responsibility before init/add/commit can fail; absence of identity never permits deletion.
          printf 'EVIDENCE_FIXTURE_OWNER=%s\nEVIDENCE_FIXTURE_PARENT=%s\n' "$fixture" "$parent" >> "$GITHUB_ENV"
          identity="$(stat -c '%d:%i' -- "$fixture")"
          printf 'EVIDENCE_FIXTURE_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          no_link_directory "$fixture"
          test "$(dirname -- "$fixture")" = "$parent"
          printf 'owner=%s\nparent=%s\nidentity=%s\n' "$fixture" "$parent" "$identity" > "$fixture/owner-receipt.txt"
          clean_git=(env -i PATH="$PATH" HOME="$fixture" LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c commit.gpgSign=false -c tag.gpgSign=false)
          phase=init
          "${clean_git[@]}" init --template= -b fixture-seed "$fixture/primary"
          "${clean_git[@]}" -C "$fixture/primary" config core.autocrlf false
          phase=data
          printf '.worktrees/\n.workbuddy/evidence/\n' > "$fixture/primary/.gitignore"
          printf 'synthetic public evidence source\n' > "$fixture/primary/source.txt"
          phase=add
          "${clean_git[@]}" -C "$fixture/primary" add -- .gitignore source.txt
          phase=commit
          "${clean_git[@]}" -C "$fixture/primary" -c user.name=EvidenceFixture -c user.email=fixture@example.invalid commit -m fixture
          phase=resolve
          sha="$("${clean_git[@]}" -C "$fixture/primary" rev-parse --verify 'HEAD^{commit}')"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'source_sha=%s\n' "$sha" >> "$fixture/owner-receipt.txt"
          printf 'EVIDENCE_FIXTURE_REPO=%s\nEVIDENCE_FIXTURE_ROOT=%s\nEVIDENCE_FIXTURE_SHA=%s\n' "$fixture/primary" "$fixture/primary" "$sha" >> "$GITHUB_ENV"
          phase=ready

      - name: Verify public evidence core and consumer
        run: node --test scripts/evidence-contract.test.mjs scripts/worktree-app-qa-journey.test.mjs scripts/test-env-bootstrap.test.mjs

      # A direct registered task below the original checkout resolves its already locked root dependencies.
      # The dynamic shell root remains unproven to the governance parser; do not relabel it static CI evidence.
      - name: Verify public application composition in a registered task root
        env:
          EXPECTED_CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          no_link_directory() {
            local path="$1"
            test "$(realpath -e -- "$path")" = "$path" || return
            while :; do
              test -d "$path" && test ! -L "$path" || return
              test "$path" != / || break
              path="$(dirname -- "$path")"
            done
          }
          primary="${GITHUB_WORKSPACE:?}"
          no_link_directory "$primary"
          no_link_directory "$primary/.git"
          clean_git=(env -i PATH="$PATH" HOME="$HOME" LC_ALL=C GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c commit.gpgSign=false -c tag.gpgSign=false)
          test "$("${clean_git[@]}" -C "$primary" rev-parse --show-toplevel)" = "$primary"
          test "$("${clean_git[@]}" -C "$primary" rev-parse --absolute-git-dir)" = "$primary/.git"
          test "$("${clean_git[@]}" -C "$primary" config --default false --get core.autocrlf)" = false
          candidate="$("${clean_git[@]}" -C "$primary" rev-parse --verify 'HEAD^{commit}')"
          main_sha="$("${clean_git[@]}" -C "$primary" rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          [[ "$candidate" =~ ^[a-f0-9]{40}$ && "$main_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$candidate" = "${EXPECTED_CANDIDATE:?}"
          test "$("${clean_git[@]}" -C "$primary" rev-parse --verify "${EXPECTED_CANDIDATE}^{commit}")" = "$candidate"
          # origin/main is actions/checkout's fetched real main, never a candidate-created alias.
          parent="$primary/.worktrees"
          retained="$primary/.workbuddy/evidence/contract-app-retained"
          for directory in "$parent" "$primary/.workbuddy" "$primary/.workbuddy/evidence" "$retained"; do
            if test ! -e "$directory" && test ! -L "$directory"; then mkdir -- "$directory"; fi
            no_link_directory "$directory"
          done
          task="$(mktemp -d "$parent/evidence-app-XXXXXX")"
          phase=created
          identity=''
          saved="$retained/${task##*/}"
          cleanup_app() {
            no_link_directory "$parent" && no_link_directory "$task" && no_link_directory "$retained" || return
            test "$(dirname -- "$task")" = "$parent" || return
            [[ "$(basename -- "$task")" =~ ^evidence-app-[A-Za-z0-9]{6}$ ]] || return
            test -n "$identity" && test "$(stat -c '%d:%i' -- "$task")" = "$identity" || return
            local registrations registered=false
            if test ! -e "$saved" && test ! -L "$saved"; then mkdir -- "$saved" || return; fi
            no_link_directory "$saved" || return
            test ! -L "$saved/owner-receipt.txt" || return
            printf 'phase=%s\nsource_exit=%s\ncleanup=started\n' "$phase" "$source_exit" >> "$saved/owner-receipt.txt" || return
            if test -e "$task/.workbuddy/evidence/contract" || test -L "$task/.workbuddy/evidence/contract"; then
              no_link_directory "$task/.workbuddy/evidence/contract" || return
              cp -a -- "$task/.workbuddy/evidence/contract" "$saved/contract" || return
            fi
            registrations="$("${clean_git[@]}" -C "$primary" worktree list --porcelain)" || return
            while IFS= read -r line; do
              if test "$line" = "worktree $task"; then registered=true; fi
            done <<< "$registrations"
            # Copy first, then recheck the exact held identity immediately before removal.
            no_link_directory "$task" || return
            test "$(stat -c '%d:%i' -- "$task")" = "$identity" || return
            if test "$registered" = true; then
              "${clean_git[@]}" -C "$primary" worktree remove --force -- "$task" || return
            else
              test ! -e "$task/.git" && test ! -L "$task/.git" || return
              rm -r -- "${task:?}" || return
            fi
            test ! -e "$task" && test ! -L "$task" || return
            printf 'cleanup=completed\n' >> "$saved/owner-receipt.txt"
          }
          app_exit() {
            local source_exit=$? cleanup_exit=0
            trap - EXIT
            set +e
            cleanup_app
            cleanup_exit=$?
            if test "$cleanup_exit" -ne 0; then
              printf 'App cleanup failed; retain owner, source_exit=%s cleanup_exit=%s\n' "$source_exit" "$cleanup_exit" >&2
            fi
            if test "$source_exit" -ne 0; then exit "$source_exit"; fi
            exit "$cleanup_exit"
          }
          # The trap owns even a failed registration/checkout, not only successful tests.
          trap app_exit EXIT
          identity="$(stat -c '%d:%i' -- "$task")"
          no_link_directory "$task"
          mkdir -- "$saved"
          no_link_directory "$saved"
          printf 'owner=%s\nparent=%s\nidentity=%s\nmain_sha=%s\ncandidate_sha=%s\nphase=created\n' "$task" "$parent" "$identity" "$main_sha" "$candidate" > "$saved/owner-receipt.txt"
          phase=register
          "${clean_git[@]}" -C "$primary" worktree add --detach "$task" origin/main
          test "$(stat -c '%d:%i' -- "$task")" = "$identity"
          test "$("${clean_git[@]}" -C "$task" rev-parse --verify 'HEAD^{commit}')" = "$main_sha"
          test "$("${clean_git[@]}" -C "$primary" rev-parse --verify 'refs/remotes/origin/main^{commit}')" = "$main_sha"
          phase=checkout-candidate
          "${clean_git[@]}" -C "$task" checkout --detach "$candidate"
          test "$("${clean_git[@]}" -C "$task" rev-parse --verify 'HEAD^{commit}')" = "$candidate"
          test "$(stat -c '%d:%i' -- "$task")" = "$identity"
          phase=tests
          node --test "$task/scripts/worktree-app-qa.test.mjs"
          phase=tests-completed

      - name: Retain evidence and clean owned public evidence data repository
        if: ${{ always() }}
        env:
          SOURCE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          no_link_directory() {
            local path="$1"
            test "$(realpath -e -- "$path")" = "$path" || return
            while :; do
              test -d "$path" && test ! -L "$path" || return
              test "$path" != / || break
              path="$(dirname -- "$path")"
            done
          }
          if test -z "${EVIDENCE_FIXTURE_OWNER:-}"; then
            printf 'No recorded core owner; no deletion attempted\n'
            exit 0
          fi
          fixture="$EVIDENCE_FIXTURE_OWNER"
          parent="${EVIDENCE_FIXTURE_PARENT:?}"
          identity="${EVIDENCE_FIXTURE_IDENTITY:?}"
          test "$parent" = "$(realpath -e -- "${RUNNER_TEMP:?}")"
          no_link_directory "$parent"
          no_link_directory "$fixture"
          test "$(dirname -- "$fixture")" = "$parent"
          [[ "$(basename -- "$fixture")" =~ ^evidence-contract-[A-Za-z0-9]{6}$ ]]
          test "$(stat -c '%d:%i' -- "$fixture")" = "$identity"
          retained="${GITHUB_WORKSPACE:?}/.workbuddy/evidence/contract-core-retained"
          no_link_directory "$GITHUB_WORKSPACE"
          # mkdir does not authorize following a pre-existing linked ancestor.
          for directory in "$GITHUB_WORKSPACE/.workbuddy" "$GITHUB_WORKSPACE/.workbuddy/evidence" "$retained"; do
            if test ! -e "$directory" && test ! -L "$directory"; then mkdir -- "$directory"; fi
            no_link_directory "$directory"
          done
          saved="$retained/$(basename -- "$fixture")"
          mkdir -- "$saved"
          no_link_directory "$saved"
          trap 'result=$?; if test "$result" -ne 0; then printf "Core retention/cleanup failed; owner preserved unless deletion already completed\n" >&2; fi' EXIT
          test -f "$fixture/owner-receipt.txt" && test ! -L "$fixture/owner-receipt.txt"
          cp -a -- "$fixture/owner-receipt.txt" "$saved/owner-receipt.txt"
          printf 'source_job_status=%s\ncleanup=started\n' "$SOURCE_JOB_STATUS" >> "$saved/owner-receipt.txt"
          if test -e "$fixture/primary/.workbuddy/evidence/contract" || test -L "$fixture/primary/.workbuddy/evidence/contract"; then
            no_link_directory "$fixture/primary/.workbuddy/evidence/contract"
            cp -a -- "$fixture/primary/.workbuddy/evidence/contract" "$saved/contract"
          fi
          if test -d "$fixture/primary"; then
            no_link_directory "$fixture/primary"
            for name in .gitignore source.txt; do
              if test -e "$fixture/primary/$name" || test -L "$fixture/primary/$name"; then
                test -f "$fixture/primary/$name" && test ! -L "$fixture/primary/$name"
                cp -a -- "$fixture/primary/$name" "$saved/$name"
                sha256sum -- "$saved/$name" >> "$saved/source-sha256.txt"
              fi
            done
          fi
          no_link_directory "$fixture"
          test "$(dirname -- "$fixture")" = "$parent"
          test "$(stat -c '%d:%i' -- "$fixture")" = "$identity"
          rm -r -- "${fixture:?}"
          test ! -e "$fixture" && test ! -L "$fixture"
          printf 'cleanup=completed\n' >> "$saved/owner-receipt.txt"

      - name: Run regression tests
        run: |
          node --test scripts/git-wt.test.mjs scripts/test-dx-pipeline.mjs scripts/worktree-delivery.test.mjs scripts/run-workspace-tests.test.mjs scripts/style-dom-probe.test.mjs
          node --test scripts/auto-qa-scan.test.mjs
          node --test scripts/test-authoring-inspection.test.mjs scripts/test-change-review.test.mjs
          node --test scripts/impact-matrix.test.mjs scripts/authorization.test.mjs scripts/qa-label.test.mjs scripts/ci-verdict.test.mjs scripts/auto-pipeline.test.mjs scripts/auto-pipeline-qa.test.mjs scripts/check-tracked-artifacts.test.mjs scripts/live-runtime-proof.test.mjs scripts/ego-browser-page.test.mjs scripts/live-page-preparation.test.mjs scripts/ego-live-qa.test.mjs scripts/repair-inspiration-covers.test.mjs scripts/import-gxgen-inspirations.test.mjs
          node --test scripts/sync-bypass.test.mjs scripts/resolve-omnimux-profile.test.mjs scripts/sync-plugin-scope.test.mjs scripts/sync-agent-presets-targets.test.mjs scripts/verify-cross-plugin-model-alignment.test.mjs scripts/verify-profile-preflight.test.mjs scripts/test-agent-tools.test.mjs
          node --test scripts/verify-skill-bilingual.test.mjs scripts/generate-featured-skills.test.mjs
          node scripts/verify-skill-bilingual.mjs
          node scripts/verify-dsh-lockfile-uniform.mjs
          node --test scripts/verify-dsh-lockfile-uniform.test.mjs
          node --test scripts/verify-modality-matrix.test.mjs

      # 路由声明（cordis.patch.yml 的 input[]）↔ 模型契约（specs/*.yaml 的 inputs[].type）
      # 模态双向对账在 verify:model-contracts 内（Issue #3236）；本地与 CI 走同一条命令。
      - name: Verify model contracts (admission + dispositions strict + modality matrix)
        run: corepack pnpm verify:model-contracts

      - name: Rebuild omnimux-workflow host + canvas bundles from src
        run: |
          node plugins/omnimux-workflow/scripts/build-host.mjs
          node plugins/omnimux-workflow/scripts/build-canvas.mjs
          test -s plugins/omnimux-workflow/dist/index.js
          test -s plugins/omnimux-workflow/lib/canvas.js

      # 每个插件的测试在合并前必须全绿：run-workspace-tests 按包 scripts.test
      # 逐一执行并 TAP 汇总；verify-plugin-load 在真实 Cordis 内加载每个插件
      # （声明的 inject 由兄弟桩纤维提供），替代原静态 verify-dsh-contracts。
      - name: Plugin unit suites (all packages)
        run: node scripts/run-workspace-tests.mjs --logs .tmp/ci-workspace-logs --json .tmp/ci-workspace-summary.json

      # The browser-extension vitest suite lives in a nested workspace package
      # and does not emit TAP, so run-workspace-tests cannot judge it; it runs
      # as its own step. Fails the gate on any red test or unhandled error.
      - name: Browser extension vitest suite
        run: corepack pnpm --filter dsh-browser-extension test

      - name: Plugin load check (Cordis runtime)
        run: node scripts/verify-plugin-load.mjs

      - name: Isolated right-sidebar chrome geometry gate
        run: |
          set -euo pipefail
          # 合并前真实浏览器几何门禁：真实内核 + 动态端口 + 零污染 + 反向对照。
          # 反向对照未复现遮挡即判定夹具失真并失败，杜绝「夹具自带答案」的假绿。
          node scripts/worktree-web-qa.mjs sidebar-chrome

      - name: Upload QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            .workbuddy/evidence/
            .tmp/ci-workspace-logs/
            .tmp/ci-workspace-summary.json
          retention-days: 7
          include-hidden-files: true

      - name: Evaluate CI verdict
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_STATUS: ${{ job.status }}
        run: |
          node scripts/ci-verdict.mjs \
            --report .workbuddy/evidence/auto-qa-report.json \
            --files-from-git --base "$QA_BASE" \
            --ci-status "$CI_STATUS" \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '--dry-run' }}
